};
const ic = (n, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

// ---------- veri ----------
let DB = {ayar:{terapist:"", klinik:"", unvan:"Fizyoterapist"}, hastalar:[], aktif:null};
let storageOk = true;
function load(){ try { const r = localStorage.getItem(KEY); if (r) DB = Object.assign(DB, JSON.parse(r)); } catch(e){ storageOk = false; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ storageOk = false; } }
const P = id => byId(DB.hastalar, id);

// ---------- durum ----------
let V = {view:"panel", hid:null, ptab:"ozet", lib:"hastalik", libAlan:"", libQ:"", libKat:"", hq:""};
function go(view, extra = {}){ Object.assign(V, {view}, extra); render(); window.scrollTo(0, 0); }

// ---------- yardımcılar ----------
function toast(msg){ document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function initials(n){ return String(n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toLocaleUpperCase("tr"); }
function age(p){ if (p.dogum){ const d = new Date(p.dogum), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; } return p.yas || ""; }
function alanTag(a){ return a ? `<span class="tag ${a}">${ALANLAR[a]}</span>` : ""; }
function condNames(p){ return (p.condIds || []).map(id => C(id)?.ad).filter(Boolean).join(", "); }
function allSessions(){ const out = []; DB.hastalar.forEach(p => (p.seanslar || []).forEach(s => out.push({p, s}))); return out.sort((a, b) => (b.s.tarih + b.s.bitis).localeCompare(a.s.tarih + a.s.bitis)); }

// ---------- modal ----------
let modalClose = null;
function modal(title, body, foot = "", size = ""){
  closeModal();
  const ov = document.createElement("div"); ov.className = "ov"; ov.id = "ov";
  ov.innerHTML = `<div class="modal ${size}"><div class="mh"><h2 class="sp">${title}</h2><button class="icon-btn" data-act="close-modal">${ic("x")}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div>`;
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  return ov;
}
function closeModal(){ $("#ov")?.remove(); if (modalClose){ const f = modalClose; modalClose = null; f(); } }
function confirmBox(msg, onYes, yesLabel = "Evet, sil"){
  modal("Emin misin?", `<p style="margin:0">${msg}</p>`, `<button class="btn" data-act="close-modal">Vazgeç</button><button class="btn pri" id="cf-yes" style="background:var(--red);border-color:var(--red)">${yesLabel}</button>`, "sm");
  $("#cf-yes").onclick = () => { closeModal(); onYes(); };
}

// ================= RENDER =================
function render(){
  const navs = [["panel","home","Panel"],["hastalar","users","Hastalar"],["kutuphane","book","Kütüphane"],["seans","play","Seans"],["ayarlar","gear","Ayarlar"]];
  const aktif = DB.aktif && P(DB.aktif.hid);
  const nav = navs.map(([v, i, t]) => `<button class="nav ${V.view === v || (v === "hastalar" && V.view === "hasta") ? "on" : ""}" data-go="${v}">${ic(i)}<span>${t}</span>${v === "seans" && aktif ? '<span class="pill">canlı</span>' : ""}</button>`).join("");
  let body = "";
  try {
    body = ({panel:vPanel, hastalar:vHastalar, hasta:vHasta, kutuphane:vLib, seans:vSeans, ayarlar:vAyar}[V.view] || vPanel)();
  } catch (e){ console.error(e); body = `<div class="note red">Bir hata oluştu: ${esc(e.message)}</div>`; }
  $("#root").innerHTML = `<div class="app"><aside class="side"><div class="brand"><div class="logo"><svg viewBox="0 0 512 512" width="34" height="34" aria-hidden="true"><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="80" y1="80" x2="430" y2="430"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#151924"/><g fill="none" stroke="url(#lg)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M250 120 C200 100 140 130 140 185 C108 200 104 260 140 282 C130 330 175 365 215 350 C232 380 250 384 256 380 L256 120"/><path d="M262 120 C312 100 372 130 372 185 C404 200 408 260 372 282 C382 330 337 365 297 350 C280 380 262 384 256 380"/><path d="M190 200 C215 205 225 225 220 245"/><path d="M322 200 C297 205 287 225 292 245"/><path d="M175 290 C200 285 215 300 215 320"/><path d="M337 290 C312 285 297 300 297 320"/></g><path d="M256 384 L256 430" stroke="url(#lg)" stroke-width="22" stroke-linecap="round"/><circle cx="400" cy="112" r="20" fill="#e5203a"/></svg></div><div><b>Fizyo Seans</b><small>Tedavi & seans yönetimi</small></div></div>${nav}<div class="foot">${esc(DB.ayar.terapist || "")}${DB.ayar.klinik ? "<br>" + esc(DB.ayar.klinik) : ""}</div></aside><main>${body}</main></div>`;
  if (V.view === "seans") tickSession();
  if (V.view === "kutuphane" && V.lib === "analiz") anStart(); else { cancelAnimationFrame(AN.raf); AN.raf = 0; }
}

// ---------- PANEL ----------
function vPanel(){
  const h = new Date().getHours(); const sel = h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
  const ses = allSessions();
  const wk = new Date(); wk.setDate(wk.getDate() - 7); const wks = wk.toISOString().slice(0, 10);
  const buHafta = ses.filter(x => x.s.tarih >= wks).length;
  const bugun = ses.filter(x => x.s.tarih === today()).length;
  const aktif = DB.aktif && P(DB.aktif.hid);
  const recentP = [...DB.hastalar].sort((a, b) => (b.guncel || "").localeCompare(a.guncel || "")).slice(0, 5);
  return `
  <div class="head"><div><h1>${sel}${DB.ayar.terapist ? ", " + esc(DB.ayar.terapist.split(" ")[0]) : ""}</h1><p>${new Date().toLocaleDateString("tr-TR", {weekday:"long", day:"numeric", month:"long", year:"numeric"})}</p></div>
  <div class="row"><button class="btn" data-go="kutuphane">${ic("book")} Kütüphane</button><button class="btn pri" data-act="new-patient">${ic("plus")} Yeni hasta</button></div></div>
  ${aktif ? `<div class="note info row" style="margin-bottom:14px"><b>Devam eden seans:</b> ${esc(aktif.ad)} <span class="sp"></span><button class="btn sm pri" data-go="seans">Seansa dön</button></div>` : ""}
  ${!storageOk ? `<div class="note warn" style="margin-bottom:14px">Bu tarayıcıda kalıcı depolama kullanılamıyor; veriler sayfa kapanınca kaybolabilir. Ayarlar'dan yedek indirin.</div>` : ""}
  ${(() => { const due = DB.hastalar.filter(h => ["zaman", "yok"].includes(evalStatus(h).durum) && (h.seanslar || []).length); return due.length ? `<div class="card" style="margin-bottom:14px;border-color:#c4d6fa"><div class="sec-t"><h2>Değerlendirme bekleyenler</h2></div><div class="list">${due.map(h => { const st = evalStatus(h); return `<div class="li" data-act="batch-eval" data-hid="${h.id}"><div class="avatar" style="background:var(--clay2);color:var(--clay)">${esc(initials(h.ad))}</div><div class="sp"><div class="t">${esc(h.ad)}</div><div class="s">${st.durum === "yok" ? "Başlangıç değerlendirmesi yok" : "Son değerlendirme " + fmtDate(st.son)}</div></div><span class="btn sm">Değerlendir</span></div>`; }).join("")}</div></div>` : ""; })()}
  <div class="grid g4">
    <div class="card stat"><b>${DB.hastalar.length}</b><span>Kayıtlı hasta</span></div>
    <div class="card stat"><b>${bugun}</b><span>Bugünkü seans</span></div>
    <div class="card stat"><b>${buHafta}</b><span>Son 7 gün</span></div>
    <div class="card stat"><b>${ses.length}</b><span>Toplam seans</span></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="sec-t"><h2>Hastalar</h2><button class="btn ghost sm" data-go="hastalar">Tümü</button></div>
      ${recentP.length ? `<div class="list">${recentP.map(pRow).join("")}</div>` : emptyBox("users", "Henüz hasta yok", `<button class="btn pri sm" data-act="new-patient">${ic("plus")} İlk hastanı ekle</button>`)}
    </div>
    <div class="card"><div class="sec-t"><h2>Son seanslar</h2></div>
      ${ses.length ? `<div class="list">${ses.slice(0, 6).map(({p, s}) => `<div class="li" data-act="open-session" data-hid="${p.id}" data-sid="${s.id}"><div class="avatar" style="background:var(--clay2);color:var(--clay)">${s.no}</div><div class="sp"><div class="t">${esc(p.ad)}</div><div class="s">${fmtDate(s.tarih)} · ${s.sureDk || 0} dk · ${(s.uygulanan || []).filter(u => u.yapildi).length} uygulama</div></div>${painDelta(s)}</div>`).join("")}</div>` : emptyBox("clip", "Seans kaydı yok", "<span class='small'>Bir hastaya program oluşturup seans başlatın.</span>")}
    </div>
  </div>
  <div class="card" style="margin-top:14px"><div class="sec-t"><h2>Kütüphane</h2></div>
    <div class="grid g4">${Object.entries(ALANLAR).map(([k, v]) => `<button class="lib-card" style="text-align:left" data-act="lib-alan" data-alan="${k}"><span class="tag ${k}">${v}</span><b style="font-family:var(--f-d);font-size:24px">${CONDITIONS.filter(c => c.alan === k).length}</b><span class="small muted">hastalık protokolü</span></button>`).join("")}</div>
    <p class="small muted" style="margin:12px 0 0">${METHODS.length} tedavi yöntemi · ${EXERCISES.length} egzersiz · ${SCALES.length} değerlendirme ölçeği</p>
  </div>`;
}
function painDelta(s){
  const a = parseFloat(s.oncesi?.vas), b = parseFloat(s.sonrasi?.vas);
  if (isNaN(a) || isNaN(b)) return "";
  const d = b - a; return `<span class="small ${d < 0 ? "delta-up" : d > 0 ? "delta-down" : "muted"}">VAS ${a}→${b}</span>`;
}
function emptyBox(icon, t, extra = ""){ return `<div class="empty">${ic(icon)}<div style="font-weight:600;color:var(--ink2)">${t}</div><div style="margin-top:10px">${extra}</div></div>`; }
function pRow(p){
  const c = (p.condIds || []).map(C).filter(Boolean)[0];
  return `<div class="li" data-act="open-patient" data-hid="${p.id}"><div class="avatar">${esc(initials(p.ad))}</div><div class="sp"><div class="t">${esc(p.ad)}</div><div class="s">${[age(p) ? age(p) + " yaş" : "", condNames(p) || p.tani].filter(Boolean).map(esc).join(" · ") || "—"}</div></div>${c ? alanTag(c.alan) : ""}<span class="small muted">${(p.seanslar || []).length} seans</span></div>`;
}

// ---------- HASTALAR ----------
function vHastalar(){
  const list = DB.hastalar.filter(p => match(V.hq, p.ad, p.tani, condNames(p), p.protokol));
  return `<div class="head"><div><h1>Hastalar</h1><p>${DB.hastalar.length} kayıt</p></div><button class="btn pri" data-act="new-patient">${ic("plus")} Yeni hasta</button></div>
  <div class="card"><div class="row" style="margin-bottom:8px"><label class="search">${ic("search")}<input type="search" id="hq" placeholder="Ad, tanı veya protokol no ile ara" value="${esc(V.hq)}"></label></div>
  ${list.length ? `<div class="list">${list.map(pRow).join("")}</div>` : emptyBox("users", DB.hastalar.length ? "Eşleşen hasta yok" : "Henüz hasta yok", DB.hastalar.length ? "" : `<button class="btn pri sm" data-act="new-patient">${ic("plus")} Hasta ekle</button>`)}</div>
  <p class="small muted" style="margin-top:12px">Gizlilik için ad yerine baş harf veya protokol numarası kullanabilirsiniz. Veriler yalnızca bu tarayıcıda saklanır.</p>`;
}
function patientForm(p = {}){
  const condOpts = Object.entries(ALANLAR).map(([k, v]) => `<optgroup label="${v}">${CONDITIONS.filter(c => c.alan === k).map(c => `<option value="${c.id}" ${(p.condIds || []).includes(c.id) ? "selected" : ""}>${esc(c.ad)}</option>`).join("")}</optgroup>`).join("");
  return `<div class="grid g2">
   <label class="f">Ad Soyad / Baş harfler *<input type="text" id="pf-ad" value="${esc(p.ad)}"></label>
   <label class="f">Protokol / dosya no<input type="text" id="pf-protokol" value="${esc(p.protokol)}"></label>
   <label class="f">Doğum tarihi<input type="date" id="pf-dogum" value="${esc(p.dogum)}"></label>
   <label class="f">Cinsiyet<select id="pf-cins"><option value="">—</option>${["Kadın","Erkek","Diğer"].map(x => `<option ${p.cins === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
   <label class="f">Tıbbi tanı (serbest metin)<input type="text" id="pf-tani" value="${esc(p.tani)}" placeholder="ör. Sol MCA infarktı, sağ hemiparezi"></label>
   <label class="f">Sevk eden hekim / kurum<input type="text" id="pf-sevk" value="${esc(p.sevk)}"></label>
  </div>
  <label class="f" style="margin-top:12px">Protokol(ler) – birden çok seçmek için Ctrl/⌘ basılı tutun<select id="pf-cond" multiple size="7">${condOpts}</select></label>
  <div class="grid g2" style="margin-top:12px">
   <label class="f">Öykü / şikayet<textarea id="pf-oyku">${esc(p.oyku)}</textarea></label>
   <label class="f">Önemli uyarılar (kontrendikasyon, ilaç, eşlik eden hastalık)<textarea id="pf-uyari">${esc(p.uyari)}</textarea></label>
  </div>`;
}
function readPatientForm(){
  return {ad:$("#pf-ad").value.trim(), protokol:$("#pf-protokol").value.trim(), dogum:$("#pf-dogum").value, cins:$("#pf-cins").value, tani:$("#pf-tani").value.trim(), sevk:$("#pf-sevk").value.trim(), condIds:[...$("#pf-cond").selectedOptions].map(o => o.value), oyku:$("#pf-oyku").value.trim(), uyari:$("#pf-uyari").value.trim()};
}
function newPatient(prefCond){
  modal("Yeni hasta", patientForm({condIds: prefCond ? [prefCond] : []}), `<button class="btn" data-act="close-modal">Vazgeç</button><button class="btn pri" id="pf-save">Kaydet</button>`, "lg");
  $("#pf-ad").focus();
  $("#pf-save").onclick = () => {
    const d = readPatientForm(); if (!d.ad){ toast("Ad gerekli"); return; }
    const p = Object.assign({id:uid(), olusturma:today(), guncel:new Date().toISOString(), olcumler:[], seanslar:[], program:null}, d);
    DB.hastalar.push(p); save(); closeModal(); go("hasta", {hid:p.id, ptab: d.condIds.length ? "program" : "ozet"});
    toast("Hasta eklendi");
  };
}
function editPatient(p){
  modal("Hasta bilgileri", patientForm(p), `<button class="btn danger ghost" id="pf-del">${ic("trash")} Sil</button><span class="sp"></span><button class="btn" data-act="close-modal">Vazgeç</button><button class="btn pri" id="pf-save">Kaydet</button>`, "lg");
  $("#pf-save").onclick = () => { const d = readPatientForm(); if (!d.ad){ toast("Ad gerekli"); return; } Object.assign(p, d, {guncel:new Date().toISOString()}); save(); closeModal(); render(); toast("Kaydedildi"); };
  $("#pf-del").onclick = () => confirmBox(`<b>${esc(p.ad)}</b> ve tüm seans/ölçüm kayıtları silinecek.`, () => { DB.hastalar = DB.hastalar.filter(x => x !== p); if (DB.aktif?.hid === p.id) DB.aktif = null; save(); go("hastalar"); toast("Silindi"); });
}

// ---------- HASTA DETAY ----------
function vHasta(){
  const p = P(V.hid); if (!p) return vHastalar();
  const tabs = [["ozet","Özet"],["deg","Değerlendirme"],["program","Tedavi programı"],["seanslar",`Seanslar (${(p.seanslar || []).length})`]];
  const content = ({ozet:ptOzet, deg:ptDeg, program:ptProgram, seanslar:ptSeanslar}[V.ptab] || ptOzet)(p);
  return `<div class="crumb"><button data-go="hastalar">Hastalar</button> / ${esc(p.ad)}</div>
  <div class="head"><div class="row" style="gap:14px"><div class="avatar" style="width:52px;height:52px;font-size:18px">${esc(initials(p.ad))}</div><div><h1>${esc(p.ad)}</h1><p>${[age(p) ? age(p) + " yaş" : "", p.cins, p.protokol ? "Protokol " + p.protokol : ""].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</p></div></div>
  <div class="row">${aiBtn("btn", p.id)}<button class="btn" data-act="edit-patient">${ic("edit")} Düzenle</button>${p.program ? `<button class="btn" data-act="handout">${ic("print")} Hasta çıktısı</button>` : ""}<button class="btn pri" data-act="start-session">${ic("play")} Seans başlat</button></div></div>
  <div class="tabs">${tabs.map(([k, t]) => `<button class="tab ${V.ptab === k ? "on" : ""}" data-ptab="${k}">${t}</button>`).join("")}</div>
  ${content}`;
}
function ptOzet(p){
  const conds = (p.condIds || []).map(C).filter(Boolean);
  const last = (p.seanslar || []).slice(-1)[0];
  const warns = conds.flatMap(c => c.dikkat || []);
  return `${evalCard(p)}<div class="grid g2">
   <div class="card"><h2 style="margin-bottom:10px">Klinik bilgi</h2>
     <table><tr><td class="muted" style="width:38%">Tıbbi tanı</td><td>${esc(p.tani) || "—"}</td></tr>
     <tr><td class="muted">Protokol</td><td>${conds.length ? conds.map(c => `<a href="#" data-act="open-cond" data-id="${c.id}">${esc(c.ad)}</a>`).join("<br>") : "—"}</td></tr>
     <tr><td class="muted">Sevk</td><td>${esc(p.sevk) || "—"}</td></tr>
     <tr><td class="muted">Kayıt</td><td>${fmtDate(p.olusturma)}</td></tr>
     <tr><td class="muted">Son seans</td><td>${last ? fmtDate(last.tarih) + " (#" + last.no + ")" : "—"}</td></tr></table>
     ${p.oyku ? `<h3 style="margin:14px 0 4px">Öykü</h3><p style="margin:0;white-space:pre-wrap">${esc(p.oyku)}</p>` : ""}
   </div>
   <div class="card"><h2 style="margin-bottom:10px">Uyarılar</h2>
     ${p.uyari ? `<div class="note red" style="white-space:pre-wrap;margin-bottom:10px">${esc(p.uyari)}</div>` : ""}
     ${warns.length ? `<ul style="margin:0;padding-left:18px">${warns.map(w => `<li class="small" style="margin:4px 0">${esc(w)}</li>`).join("")}</ul>` : `<p class="muted small">Protokol seçilince ilgili kırmızı bayraklar burada görünür.</p>`}
   </div></div>
   <div class="card"><div class="sec-t"><h2>Son ölçümler</h2><button class="btn sm" data-ptab="deg">Tümü</button></div>${measureSummary(p)}</div>`;
}

// ---------- DEĞERLENDİRME ----------
function measureGroups(p){
  const g = {}; (p.olcumler || []).forEach(o => { const k = o.sid + (S(o.sid)?.alt ? "|" + (o.not || "").trim().toLocaleLowerCase("tr") : ""); (g[k] = g[k] || []).push(o); });
  Object.values(g).forEach(a => a.sort((x, y) => x.tarih.localeCompare(y.tarih)));
  return g;

function picker(title, items, groups, onPick, onClose){
  // items: {id, ad, alt, grp}

  modal(title, body, `<button class="btn" data-act="close-modal">Kapat</button>`);
  if (onClose) modalClose = onClose;
  let q = "", grp = "";
  const draw = () => { $("#pk-list").innerHTML = items.filter(it => (!grp || it.grp === grp) && match(q, it.ad, it.alt)).map(it => `<div class="pick" data-pk="${it.id}"><div class="sp"><div style="font-weight:600">${esc(it.ad)}</div><div class="small muted">${esc(it.alt)}</div></div>${ic("plus").replace("<svg", '<svg width="18" height="18" style="color:var(--teal)"')}</div>`).join("") || `<p class="muted">Sonuç yok.</p>`; };
  draw();
  $("#pk-q").oninput = e => { q = e.target.value; draw(); };
  $("#ov").addEventListener("click", e => {
    const g = e.target.closest("[data-pkg]"); if (g){ grp = g.dataset.pkg; $("#ov").querySelectorAll("[data-pkg]").forEach(b => b.classList.toggle("on", b === g)); draw(); return; }
    const it = e.target.closest("[data-pk]"); if (it){ onPick(it.dataset.pk); it.style.opacity = .4; toast("Eklendi"); }
  });
  $("#pk-q").focus();
}

async function downloadFile(name, data){
  try {
    if (typeof claude !== "undefined" && claude.use){
      const dl = await claude.use("downloads");
      if (dl){ await dl.save({filename:name, data}); toast("İndirildi"); return; }
    }
  } catch (e){ if (e && e.code === "declined") return; console.warn(e); }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: name.endsWith(".json") ? "application/json" : "text/html"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  catch (e){ toast("İndirme bu görünümde desteklenmiyor"); }
}
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast("Panoya kopyalandı"); } catch (e){ toast("Kopyalanamadı"); } }

function vitalsAlerts(o){

  const used = CONDITIONS.filter(c => c.yontem.includes(m.id));
  modal(esc(m.ad), `<div class="det"><span class="tag gray">${YONTEM_KAT[m.kat]}</span><p style="margin:10px 0 0">${esc(m.ozet)}</p>
  <h3>İlkeler / parametreler</h3>${ul(m.ilkeler || [])}
  ${m.uygulama?.length ? `<h3>Uygulama</h3>${ul(m.uygulama)}` : ""}
  <h3>Doz</h3><p style="margin:0">${esc(m.doz)}</p>
  <div class="grid g2" style="margin-top:12px"><div class="note info small"><b>Endikasyon:</b> ${esc(m.endikasyon)}</div><div class="note warn small"><b>Kontrendikasyon / dikkat:</b> ${esc(m.kontrendikasyon)}</div></div>
  ${used.length ? `<h3>Kullanıldığı protokoller</h3><div class="chips">${used.map(c => `<button class="chip" data-act="open-cond" data-id="${c.id}">${esc(c.ad)}</button>`).join("")}</div>` : ""}
  ${m.kaynak && m.kaynak !== "—" ? `<p class="small muted" style="margin-top:16px">Kaynak: ${esc(m.kaynak)}</p>` : ""}</div>`, `<button class="btn" data-act="close-modal">Kapat</button>`, "lg");
}

  ${sec("Nörofizyolojik / biyomekanik gerekçe", d.noro ? `<p style="margin:0">${esc(d.noro)}</p>` : "")}

  ${(() => { const u = CONDITIONS.filter(c => c.egz.includes(e.id)); return u.length ? sec("Kullanıldığı protokoller", `<div class="chips">${u.map(c => `<button class="chip" data-act="open-cond" data-id="${c.id}">${esc(c.ad)}</button>`).join("")}</div>`) : ""; })()}</div>`,
  `<button class="btn" data-act="close-modal">Kapat</button>`, "lg");

function openRehber(id){
  const r = REHBER.find(x => x.id === id); if (!r) return;
  let body = "";
  const para = t => esc(t).split("\n").map(l => l.startsWith("• ") ? `<div style="margin:3px 0 3px 4px">${l}</div>` : `<p style="margin:6px 0">${l}</p>`).join("");
  if (r.bolum === "DEG"){
    body = `<h3>Ne zaman?</h3>${DEG_ZAMAN.genel.map(x => `<div class="phase"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}
    <h3>Alanlara göre ara değerlendirme sıklığı</h3>${Object.entries(DEG_ZAMAN.alan).map(([k, v]) => `<div class="phase"><b>${ALANLAR[k]}</b><span>${esc(v)}</span></div>`).join("")}
    <h3>Nasıl yapılır, ne zaman anlamlıdır?</h3><ul>${DEG_ZAMAN.kural.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Ölçeklere göre anlamlı değişim eşikleri</h3><table><thead><tr><th>Ölçek</th><th>Eşik</th><th>Dayanak</th></tr></thead><tbody>${Object.entries(SC_ANLAM).map(([k, v]) => `<tr><td>${esc(S(k)?.ad || k)}</td><td><b>${v[0]}</b> ${esc(S(k)?.birim || "")}</td><td class="small">${esc(v[1])}</td></tr>`).join("")}</tbody></table>
    <p class="small muted" style="margin-top:10px">Kaynaklar: Moore JL et al. A Core Set of Outcome Measures for Adults With Neurologic Conditions (JNPT 2018); Shirley Ryan AbilityLab Rehabilitation Measures Database; ölçeklerin özgün psikometrik çalışmaları.</p>`;
  } else if (r.bolum === "SEANS"){
    body = `<p>Her seans bir hipotezi test eder: ‘Bu bozukluğu bu yöntemle değiştirirsem, hedef aktivite iyileşir.’ Seans; ön değerlendirme → hazırlık → bozukluk düzeyi → görev/fonksiyon → kapanış (yeniden ölçüm + ev programı) akışıyla kurulur ve bir sonraki seansın başındaki ölçüm, öğrenmenin (retansiyon) kanıtıdır.</p>
    ${Object.entries(SEANS_SABLON).map(([k, t]) => `<h3>${ALANLAR[k]} · ${t.sure}</h3>${t.bloklar.map((b, i) => `<div class="phase"><b>${i + 1}. ${esc(b[0])} <span class="muted small">~${b[1]} dk</span></b><span class="small">${esc(b[2])}</span></div>`).join("")}`).join("")}
    <h3>Haftalık ilerleme mantığı</h3><ul><li>1. hafta: Eğitim, ağrı/tonus yönetimi, temel aktivasyon, ev programını öğretme.</li><li>2–3. hafta: Yük ve tekrar artışı, görev pratiğinde yardımın azaltılması.</li><li>4. hafta: Ara değerlendirme → hedef ve plan revizyonu.</li><li>Sonraki dönem: Değişken ortam, çift görev, katılım hedeflerine yönelik pratik; seans sıklığını azaltıp öz-yönetime geçiş.</li></ul>`;
  } else if (r.bolum === "KTAPE"){
    const m = M("m_bant");
    body = `<p>${esc(m.ozet)}</p><h3>Teknikler</h3><ul>${m.ilkeler.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="note warn small"><b>Kontrendikasyonlar:</b> ${esc(m.kontrendikasyon)}</div>
      <h3>Endikasyon tarifleri</h3>${KTAPE.map(k => `<div class="phase"><b>${esc(k.ad)} <span class="tag gray">${esc(k.teknik)}</span></b><span class="small">${esc(k.ozet)}</span>${k.cond.length ? `<div class="chips" style="margin-top:4px">${k.cond.map(id => C(id) ? `<button class="chip" style="font-size:11.5px;padding:2px 8px" data-act="open-cond" data-id="${id}">${esc(C(id).ad)}</button>` : "").join("")}</div>` : ""}</div>`).join("")}
      <p class="small muted" style="margin-top:12px">Kaynak: ${esc(KAYNAK_KT)}</p>`;
  } else if (r.bolum === "BOBATH"){
    body = `<div class="note info small">Kitaba göre dönemlerin kesin süresi yoktur ve iç içe geçebilir (ör. üst ekstremite flask iken alt ekstremitede belirgin spastisite). Kompansasyona izin verilmez; aşırı efor spastisiteyi ve birleşik reaksiyonları artırır.</div>` +
      BOBATH_PROG.map(d => `<h3>${esc(d.donem)}</h3><p style="margin:4px 0 8px">${esc(d.tanim)}</p><table><tbody>${d.egz.map(e => `<tr><td style="width:28%"><b>${esc(e[0])}</b></td><td class="small">${esc(e[1])}</td></tr>`).join("")}</tbody></table>`).join("") +
      `<p class="small muted" style="margin-top:12px">Kaynak: ${esc(KAYNAK_NGT)}</p>`;
  } else if (r.bolum === "POZ"){
    body = POZ_HATA.map(z => `<h3>${esc(z.poz)}</h3><div class="note info small" style="margin-bottom:8px"><b>İdeal dizilim:</b> ${esc(z.ideal)}</div><table><thead><tr><th style="width:32%">Hata</th><th style="width:30%">Olası neden</th><th>Düzeltme</th></tr></thead><tbody>${z.hatalar.map(h => `<tr><td><b style="color:var(--clay)">${esc(h[0])}</b></td><td class="small">${esc(h[1])}</td><td class="small">${esc(h[2])}</td></tr>`).join("")}</tbody></table>`).join("");
  } else {
    body = r.bolum.map(([t, x]) => `<h3>${esc(t)}</h3>${para(x)}`).join("");
  }
  modal(esc(r.baslik), `<div class="det">${body}</div>`, `<button class="btn" data-act="close-modal">Kapat</button>`, "lg");
}

   <button class="btn danger ghost" data-act="wipe" style="margin-left:6px">${ic("trash")} Tüm verileri sil</button></div>
  <p class="small muted">Bu uygulama klinik karar desteği içindir; içerik güncel kılavuzlara dayanır ancak klinik muayene ve hekim önerisinin yerini tutmaz. Parametreleri hastaya göre uyarlayın.</p>`;

function addDemo(){
  const p = {id:uid(), ad:"Örnek Hasta (A.Y.)", protokol:"DEMO-01", dogum:"1958-04-12", cins:"Erkek", tani:"Sol MCA infarktı, sağ hemiparezi (3. ay)", sevk:"Nöroloji", condIds:["c_inme"], oyku:"Sağ kol ve bacakta güçsüzlük, baston ile yürüyor. Sağ omuzda hareketle ağrı.", uyari:"Hipertansiyon, antikoagülan kullanıyor.", olusturma:today(), guncel:new Date().toISOString(), olcumler:[], seanslar:[]};
  p.program = buildProgram(p.condIds);
  const d = n => { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };
  [[28, 38, 22, .42, 5], [14, 42, 27, .55, 4], [0, 46, 31, .68, 3]].forEach(([n, berg, fm, hiz, vas]) => {
    p.olcumler.push({id:uid(), sid:"s_berg", deger:berg, tarih:d(n), not:""}, {id:uid(), sid:"s_fugl_ue", deger:fm, tarih:d(n), not:""}, {id:uid(), sid:"s_10m", deger:hiz, tarih:d(n), not:""}, {id:uid(), sid:"s_vas", deger:vas, tarih:d(n), not:"omuz"});
  });
  p.seanslar.push({id:uid(), no:1, tarih:d(2), baslangic:"10:00", bitis:"10:50", sureDk:50, oncesi:{vas:"4", kh:"76", kb:"135/85", spo2:"97"}, sonrasi:{vas:"3", kh:"88", kb:"140/85"}, uygulanan:p.program.klinik.slice(0, 4).map(k => ({ad:k.ad, sure:k.sure, yapildi:true})), soap:{s:"Omuz ağrısı azaldı, evde egzersizlerini yaptığını söylüyor.", o:"Oturmadan kalkmada simetri arttı, Berg 46.", a:"Denge ve yürüme hızında ilerleme.", p:"Basamak çalışması ve toplum içi yürüme eklenecek."}});
  DB.hastalar.push(p); save(); go("hasta", {hid:p.id, ptab:"ozet"}); toast("Örnek hasta eklendi");
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go(g.dataset.go); closeModal(); return; }
  const pt = e.target.closest("[data-ptab]"); if (pt){ V.ptab = pt.dataset.ptab; render(); return; }
  const lb = e.target.closest("[data-lib]"); if (lb){ V.lib = lb.dataset.lib; V.libKat = ""; render(); return; }
  const an = e.target.closest("[data-an]"); if (an){ AN.id = an.dataset.an; AN.v = 0; AN.t = 0; AN.play = true; render(); return; }
  const anv = e.target.closest("[data-anv]"); if (anv){ AN.v = +anv.dataset.anv; AN.play = true; render(); return; }
  const anf = e.target.closest("[data-anf]"); if (anf){ anJump(+anf.dataset.anf); return; }
  const ch = e.target.closest("[data-chip]"); if (ch){ V[ch.dataset.chip] = ch.dataset.v; render(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, p = P(V.hid);
  if (t.tagName === "A") e.preventDefault();
  const A = {
    "close-modal": () => closeModal(),
    "new-patient": () => newPatient(),
    "open-patient": () => { closeModal(); go("hasta", {hid:t.dataset.hid, ptab:"ozet"}); },
    "edit-patient": () => editPatient(p),
    "lib-alan": () => go("kutuphane", {lib:"hastalik", libAlan:t.dataset.alan}),
    "open-cond": () => openCond(C(t.dataset.id)),
    "open-method": () => openMethod(M(t.dataset.id)),
    "open-ex": () => openEx(E(t.dataset.id)),
    "open-scale": () => openScale(S(t.dataset.id)),
    "ai-open": () => aiOpen(t.dataset.hid ? P(t.dataset.hid) : null),
    "ai-toggle": () => { DB.ayar.claude = t.checked; save(); render(); },
    "open-test": () => openTest(T(t.dataset.id)),
    "cond-new": () => { const id = t.dataset.id; closeModal(); newPatient(id); },
    "cond-apply": () => {
      const id = t.dataset.id;
      if (!DB.hastalar.length){ toast("Önce hasta ekleyin"); return; }
      modal("Hasta seç", `<div class="list">${DB.hastalar.map(h => `<div class="li" data-applyto="${h.id}"><div class="avatar">${esc(initials(h.ad))}</div><div class="sp"><div class="t">${esc(h.ad)}</div><div class="s">${h.program ? "Mevcut programa eklenecek" : "Yeni program oluşturulacak"}</div></div></div>`).join("")}</div>`, "", "sm");
      $("#ov").onclick = ev => { const r = ev.target.closest("[data-applyto]"); if (!r) return; const h = P(r.dataset.applyto); h.condIds = [...new Set([...(h.condIds || []), id])];
        if (!h.program) h.program = buildProgram([id]); else { const nb = buildProgram([id]); h.program.condIds = [...new Set([...h.program.condIds, id])]; nb.hedefler.forEach(x => h.program.hedefler.some(y => y.metin === x.metin) || h.program.hedefler.push(x)); nb.klinik.forEach(k => h.program.klinik.some(y => y.mid === k.mid) || h.program.klinik.push(k)); nb.ev.forEach(k => h.program.ev.some(y => y.eid === k.eid) || h.program.ev.push(k)); h.program.guncel = today(); }
        save(); closeModal(); go("hasta", {hid:h.id, ptab:"program"}); toast("Protokol uygulandı"); };
    },
    "add-measure": () => addMeasure(p, t.dataset.sid),
    "measure-hist": () => measureHist(p, t.dataset.key),
    "del-measure": () => { p.olcumler = p.olcumler.filter(o => o.id !== t.dataset.mid); save(); closeModal(); render(); toast("Silindi"); },
    "make-program": () => { const ids = [...document.querySelectorAll("#pc-list input:checked")].map(i => i.value); if (!ids.length){ toast("En az bir protokol seçin"); return; } p.condIds = [...new Set([...(p.condIds || []), ...ids])]; p.program = buildProgram(ids); save(); render(); toast("Program oluşturuldu – düzenleyebilirsiniz"); },
    "blank-program": () => { p.program = {condIds:[], olusturma:today(), guncel:today(), hedefler:[], icfProb:{bf:[], akt:[], kat:[], cevre:[]}, klinik:[], ev:[], sikl:"Haftada 3 seans", sure:"4 hafta", evNot:""}; save(); render(); },
    "reset-program": () => confirmBox("Program silinecek (seans kayıtları kalır).", () => { p.program = null; save(); render(); }),
    "goal-add": () => goalBuilder(p),
    "goal-del": () => { p.program.hedefler = p.program.hedefler.filter(h => h.id !== t.dataset.id); save(); render(); },
    "icf-add": () => { (p.program.icfProb[t.dataset.lv] = p.program.icfProb[t.dataset.lv] || []).push(t.dataset.txt || ""); save(); render(); if (!t.dataset.txt){ const ins = document.querySelectorAll(`[data-icfl="${t.dataset.lv}"]`); ins[ins.length - 1]?.focus(); } },
    "icf-del": () => { p.program.icfProb[t.dataset.lv].splice(+t.dataset.i, 1); save(); render(); },
    "batch-eval": () => { closeModal(); batchEval(P(t.dataset.hid) || p); },
    "open-rehber": () => openRehber(t.dataset.id),
    "an-play": () => { AN.play = !AN.play; render(); },
    "an-speed": () => { AN.hiz = AN.hiz === 1 ? .5 : AN.hiz === .5 ? .25 : 1; render(); },
    "open-an": () => { closeModal(); AN.id = t.dataset.id; AN.v = 0; AN.t = 0; AN.play = true; go("kutuphane", {lib:"analiz"}); },
    "mv": () => { const L = p.program[t.dataset.list], i = +t.dataset.i, j = i + +t.dataset.d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; p.program.guncel = today(); save(); render(); },
    "rm": () => { p.program[t.dataset.list].splice(+t.dataset.i, 1); p.program.guncel = today(); save(); render(); },
    "pick-method": () => { picker("Yöntem ekle", METHODS.map(m => ({id:m.id, ad:m.ad, alt:YONTEM_KAT[m.kat], grp:m.kat})), YONTEM_KAT, id => { const m = M(id); p.program.klinik.push({id:uid(), mid:id, ad:m.ad, sure:m.sure || 10, doz:"", not:""}); p.program.guncel = today(); save(); }, render); },
    "pick-ex": () => { picker("Egzersiz ekle", EXERCISES.map(e => ({id:e.id, ad:e.ad, alt:e.bolge + " · " + EGZ_KAT[e.kat], grp:e.kat})), EGZ_KAT, id => { const e = E(id); p.program.ev.push({id:uid(), eid:id, set:e.doz.set, tekrar:e.doz.tekrar, tut:e.doz.tut, siklik:e.doz.siklik, not:""}); p.program.guncel = today(); save(); }, render); },
    "handout": () => showHandout(p),
    "handout-dl": () => downloadFile(`ev-programi-${(p.ad || "hasta").replace(/[^\wçğıöşüÇĞİÖŞÜ]+/g, "-")}.html`, handoutHTML(p, true)),
    "handout-copy": () => copyText(handoutText(p)),
    "start-session": () => startSession(t.dataset.hid ? P(t.dataset.hid) : p),
    "open-session": () => { const h = P(t.dataset.hid); const s = h?.seanslar.find(x => x.id === t.dataset.sid); if (s) sessionDetail(h, s); },
    "s-toggle": () => { const it = DB.aktif.items.find(i => i.id === t.dataset.id); it.yapildi = !it.yapildi; it.calisiyor = false; save(); render(); },
    "s-timer": () => { const it = DB.aktif.items.find(i => i.id === t.dataset.id); if (it.calisiyor){ it.calisiyor = false; it.kalan = Math.max(0, (it.bitisTs - Date.now()) / 1000); } else { DB.aktif.items.forEach(i => { if (i.calisiyor){ i.calisiyor = false; i.kalan = Math.max(0, (i.bitisTs - Date.now()) / 1000); } }); if ((it.kalan ?? 0) <= 0) it.kalan = it.sure * 60; it.calisiyor = true; it.bitisTs = Date.now() + it.kalan * 1000; } save(); render(); },
    "s-rm": () => { DB.aktif.items = DB.aktif.items.filter(i => i.id !== t.dataset.id); save(); render(); },
    "s-add": () => { picker("Seansa uygulama ekle", METHODS.map(m => ({id:m.id, ad:m.ad, alt:YONTEM_KAT[m.kat], grp:m.kat})), YONTEM_KAT, id => { const m = M(id); DB.aktif.items.push({id:uid(), ad:m.ad, mid:id, sure:m.sure || 10, doz:"", yapildi:false, kalan:(m.sure || 10) * 60, calisiyor:false}); save(); }, render); },
    "s-cancel": () => confirmBox("Seans kaydedilmeden kapatılacak.", () => { DB.aktif = null; save(); go("panel"); }, "Seansı iptal et"),
    "s-finish": () => finishSession(),
    "backup": () => downloadFile(`fizyo-seans-yedek-${today()}.json`, JSON.stringify(DB, null, 1)),
    "backup-copy": () => copyText(JSON.stringify(DB)),
    "demo": () => addDemo(),
    "wipe": () => confirmBox("Tüm hastalar, programlar ve seanslar kalıcı olarak silinecek. Önce yedek almanız önerilir.", () => { DB = {ayar:DB.ayar, hastalar:[], aktif:null}; save(); go("panel"); toast("Veriler silindi"); }, "Hepsini sil")
  };
  (A[act] || (() => {}))();
});
document.addEventListener("input", e => {
  const t = e.target, p = P(V.hid);
  if (t.id === "hq"){ V.hq = t.value; const pos = t.selectionStart; render(); const n = $("#hq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === "lq"){ V.libQ = t.value; const pos = t.selectionStart; render(); const n = $("#lq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === "pc-q"){ document.querySelectorAll("#pc-list .pick").forEach(l => l.style.display = match(t.value, l.dataset.name) ? "" : "none"); return; }
  if (t.dataset.hg){ const h = p.program.hedefler.find(x => x.id === t.dataset.hg); if (h){ h.metin = t.value; save(); } return; }
  if (t.dataset.icfl){ p.program.icfProb[t.dataset.icfl][+t.dataset.i] = t.value; save(); return; }
  if (t.dataset.kl){ p.program.klinik[+t.dataset.i][t.dataset.kl] = t.value; p.program.guncel = today(); save(); return; }
  if (t.dataset.ev){ p.program.ev[+t.dataset.i][t.dataset.ev] = t.value; p.program.guncel = today(); save(); return; }
  if (t.dataset.pf){ p.program[t.dataset.pf] = t.value; save(); return; }
  if (t.dataset.soap){ DB.aktif.soap[t.dataset.soap] = t.value; save(); return; }
  if (t.dataset.vit){ DB.aktif[t.dataset.vit][t.dataset.k] = t.value; save(); const w = $("#w-" + t.dataset.vit); if (w) w.innerHTML = warnHTML(DB.aktif[t.dataset.vit]); return; }
  if (t.dataset.ayar){ DB.ayar[t.dataset.ayar] = t.value; save(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.closest("#pc-list") && t.type === "checkbox"){ t.closest(".pick").classList.toggle("on", t.checked); return; }
  if (t.dataset.hgs){ const p = P(V.hid), h = p.program.hedefler.find(x => x.id === t.dataset.id); if (h){ h[t.dataset.hgs] = t.value; if (t.dataset.hgs === "durum" && t.value !== "ulasildi" && h.olcek) h.olcek = h.olcek; save(); render(); } return; }
  if (t.id === "s-ev"){ DB.aktif.evGozden = t.checked; save(); return; }
  if (t.id === "restore" && t.files[0]){
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.hastalar)) throw 0;
      confirmBox(`Yedekte ${d.hastalar.length} hasta var. Mevcut veriler bu yedekle <b>değiştirilecek</b>.`, () => { DB = Object.assign({ayar:{}, hastalar:[], aktif:null}, d); migrate(); save(); go("panel"); toast("Yedek yüklendi"); }, "Yükle"); } catch (err){ toast("Geçersiz yedek dosyası"); } };
    r.readAsText(t.files[0]); t.value = "";
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#ov")) closeModal(); });

load(); migrate(); render();

</script></body></html>
