<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fizyo Seans – Tedavi ve Seans Yönetimi</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0d13"><meta name="apple-mobile-web-app-title" content="Fizyo Seans"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --paper:#f3f4f7; --card:#ffffff; --ink:#0d1017; --ink2:#3b4250; --mute:#7a8191; --line:#dde0e8;
  --teal:#5b2fd4; --teal2:#efeafd; --teal3:#cdbff8; --clay:#1c5fdc; --clay2:#e7effd; --gold:#9a6200; --gold2:#fbf1dc;
  --red:#d01b2f; --red2:#fde8eb; --green:#14804a; --green2:#e2f4ea;
  --noro:#5b2fd4; --orto:#1c5fdc; --ped:#9a6200; --kardiyo:#d01b2f;
  --side:#0b0d13; --side2:#151924; --sidet:#aab1c0;
  --r:8px; --shadow:0 1px 2px rgba(13,16,23,.06);
  --f-d:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15} h2{font-size:21px} h3{font-size:16.5px}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:#efebe3;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--f-d);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--mute);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink2);font-weight:500;width:100%}
.nav:hover{background:rgba(91,47,212,.07);color:var(--ink)}
.nav.on{background:var(--card);color:var(--teal);box-shadow:var(--shadow)}
.nav svg{width:18px;height:18px;flex:none}
.nav .pill{margin-left:auto;background:var(--clay);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.side .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:8px}
main{padding:28px 34px 80px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--ink2)}
.crumb{font-size:13px;color:var(--mute);margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--teal);cursor:pointer;padding:0;font-weight:500}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat b{font-family:var(--f-d);font-size:30px;display:block;line-height:1.1}
.stat span{color:var(--ink2);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--mute)} .small{font-size:13px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--teal3)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#4a22b8}
.btn.clay{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:rgba(0,0,0,.04)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--mute);padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
/* inputs */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:550;color:var(--ink2)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;width:100%;font-size:14.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(91,47,212,.12)}
textarea{resize:vertical;min-height:70px}
.search{position:relative;flex:1;min-width:200px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;color:var(--mute)}
/* chips/tags */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:99px;font-size:13px;cursor:pointer;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--teal2);color:var(--teal);letter-spacing:.01em}
.tag.noro{background:#efeafd;color:var(--noro)} .tag.orto{background:var(--teal2);color:var(--orto)} .tag.ped{background:#fbf1dc;color:var(--ped)} .tag.kardiyo{background:var(--red2);color:var(--kardiyo)}
.tag.kadin{background:#fbe7f1;color:#a3236b}
.tag.gray{background:#eceef3;color:var(--ink2)}
/* subtabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink2);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--teal);border-color:var(--teal)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:rgba(91,47,212,.03)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--teal2);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--mute)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lib-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.lib-card:hover{border-color:var(--teal3);transform:translateY(-1px)}
.lib-card h3{font-size:15.5px}
.lib-card p{margin:0;font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* detail */
.det h3{margin:18px 0 8px;font-size:15px;font-family:var(--f-b);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--teal)}
.det ul{margin:0;padding-left:20px} .det li{margin:4px 0}
.note{border-radius:10px;padding:10px 14px;font-size:14px}
.note.warn{background:var(--clay2);color:#123f99}
.note.info{background:var(--teal2);color:#3b1c99}
.note.gold{background:var(--gold2);color:#6b4500}
.note.red{background:var(--red2);color:var(--red)}
.phase{border-left:3px solid var(--teal3);padding:4px 0 4px 12px;margin:8px 0}
.phase b{display:block;font-size:14px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl-in input,.tbl-in select{padding:5px 8px;font-size:13.5px}
/* program items */
.pitem{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pnum{width:26px;height:26px;border-radius:50%;background:var(--teal2);color:var(--teal);font-weight:700;font-size:13px;display:grid;place-items:center}
.pfields{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:8px;margin-top:8px}
.pfields input{padding:5px 8px;font-size:13.5px}
.pfields label{font-size:11.5px;color:var(--mute);font-weight:600;display:flex;flex-direction:column;gap:3px}
/* session */
.timer{font-family:var(--f-d);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.sitem.done{background:var(--green2);border-color:#bfe0cb}
.sitem .cd{font-variant-numeric:tabular-nums;font-weight:700;min-width:56px;text-align:right}
.sitem.run{border-color:var(--teal);box-shadow:0 0 0 3px rgba(91,47,212,.12)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--teal3);display:grid;place-items:center;cursor:pointer;background:#fff;flex:none}
.sitem.done .check{background:var(--green);border-color:var(--green);color:#fff}
.check svg{width:14px;height:14px}
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.sm{max-width:440px}
.modal.lg{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mb{padding:18px 22px;max-height:calc(100vh - 220px);overflow-y:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(8px);opacity:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:80;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .2s}
.pick{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.pick:hover{background:var(--teal2)}
.pick.on{border-color:var(--teal);background:var(--teal2)}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty svg{width:42px;height:42px;color:var(--teal3);margin-bottom:8px}
.spark{display:block}
.delta-up{color:var(--green);font-weight:700} .delta-down{color:var(--red);font-weight:700}
/* handout preview */
.handout{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 30px;font-size:14px}
.handout h1{font-size:22px}
.hx{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;break-inside:avoid}
.hx b{font-size:15px}
.hx ol{margin:6px 0 4px;padding-left:20px}
.hdose{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--teal);font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:40;justify-content:space-around}
  .brand,.side .foot{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;align-items:center;text-align:center}
  .nav .pill{position:absolute;margin:0 0 0 22px;font-size:9px;padding:0 5px}
  main{padding:20px 16px 100px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .vitals{grid-template-columns:repeat(3,1fr)}
  .pfields{grid-template-columns:1fr 1fr}
  h1{font-size:24px}
}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.grid>.card{margin-top:0}
.empty .btn svg{width:16px;height:16px;margin:0;color:inherit}
.sec-t h3{margin:0}
.an-fazlar{display:flex;border-top:1px solid var(--line);overflow-x:auto}
.an-faz{flex:1;min-width:110px;border:0;border-right:1px solid var(--line);background:none;padding:10px 12px;text-align:left;cursor:pointer;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);border-top:2px solid transparent;margin-top:-1px}
.an-faz:last-child{border-right:0}
.an-faz.on{border-top-color:#b3264a;color:var(--ink);background:#fff}
.an-faz span{color:var(--mute)}
.an-olcu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-top:1px solid var(--line)}
.an-olcu>div{padding:12px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.an-olcu span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.an-olcu b{font-family:var(--f-d);font-size:24px;font-weight:500}
main{min-width:0}
.app{grid-template-columns:232px minmax(0,1fr)}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.ai-out{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:52vh;overflow:auto;font-size:14px;line-height:1.55}
.ai-out h3{margin:12px 0 4px}
.ai-out ul{padding-left:20px;margin:4px 0}

/* ===== Tema: kurumsal / altyapı ===== */
h1,h2,h3{font-family:var(--f-d);letter-spacing:-.005em}
h1{font-size:25px;font-weight:600} h2{font-size:18px;font-weight:600} h3{font-weight:600}
.side{background:var(--side);border-right:1px solid #1d2230;color:var(--sidet)}
.brand b{color:#fff;font-family:var(--f-d);font-weight:600;letter-spacing:.01em}
.brand small{color:#6f778a;font-family:var(--f-m);font-size:11px;letter-spacing:.02em}
.brand .logo{border-radius:6px;background:linear-gradient(135deg,#5b2fd4,#1c5fdc)}
.nav{color:var(--sidet);border-radius:6px;position:relative}
.nav:hover{background:var(--side2);color:#fff}
.nav.on{background:var(--side2);color:#fff;box-shadow:none}
.nav.on::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:#7c5cff}
.nav .pill{background:var(--red)}
.side .foot{color:#6f778a;border-top:1px solid #1d2230;padding-top:12px}
.card,.lib-card,.sitem,.handout,.hx,.ai-out{border-radius:var(--r)}
.card{box-shadow:none}
.btn{border-radius:6px;font-weight:600}
.btn.sm{border-radius:5px}
.btn.pri{background:var(--teal);border-color:var(--teal)}
.btn.clay{background:var(--clay);border-color:var(--clay)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border-radius:6px}
.chip{border-radius:6px}
.chip.on{background:var(--ink);border-color:var(--ink)}
.tag{border-radius:4px;font-weight:600;letter-spacing:.02em}
.tabs{border-bottom:1px solid var(--line)}
.tab.on{color:var(--teal);border-color:var(--teal)}
.lib-card:hover{border-color:var(--teal);transform:none;box-shadow:0 0 0 3px rgba(91,47,212,.08)}
.det h3{color:var(--teal);font-size:12.5px;letter-spacing:.09em}
.note{border-radius:6px}
.note.warn{background:var(--red2);color:#8f1020;border-left:3px solid var(--red)}
.note.info{background:var(--clay2);color:#123f99;border-left:3px solid var(--clay)}
.note.gold{border-left:3px solid var(--gold)}
.modal{border-radius:10px}
.toast{border-radius:6px}
.stat b,.timer,.an-olcu b{font-family:var(--f-m);font-weight:500;letter-spacing:-.02em}
table th{font-family:var(--f-m);font-size:11px;letter-spacing:.06em}
.avatar{border-radius:6px;background:var(--teal2);color:var(--teal)}
.pnum{border-radius:5px}
.check{border-radius:4px}
.head h1::before{content:"";display:inline-block;width:8px;height:8px;background:var(--teal);margin-right:10px;vertical-align:middle;border-radius:2px;transform:translateY(-2px)}
@media (max-width:860px){.side{border-top:1px solid #1d2230}.nav.on::before{left:25%;right:25%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}}
.tag.orto{background:var(--clay2);color:var(--orto)}
.lib-card>.tag,.lib-card .tag{align-self:flex-start}
.brand small{white-space:nowrap;font-size:10.5px}
.brand .logo{background:none;width:34px;height:34px;padding:0;border:1px solid #262b3a;border-radius:9px;overflow:hidden}
.brand .logo svg{display:block}

     "İnhibisyon (güncel bakış): Eski ‘refleks inhibe edici paternler’ yerine, istenmeyen kompansasyon ve aşırı efor azaltılarak daha verimli hareketin önü açılır; hizalama, uzama ve stabilite sağlanır.",

     "ICF çerçevesi: Vücut yapı-fonksiyon, aktivite ve katılım düzeylerinde hedef konur; hedefler hastayla birlikte belirlenir."

dx("e_cene_ice","Sırtüstü / oturma","Derin servikal fleksörlerin (longus colli/capitis) tonik dayanıklılığını ve kraniyoservikal motor kontrolü artırmak; ileri baş postürünü azaltmak.","Longus colli, longus capitis, rektus kapitis anterior/lateralis",

function icfTahmin(t){
  t = (t || "").toLocaleLowerCase("tr");
  if (/(katılım|işe|iş ve|okul|sosyal|topluma|toplum içi|spor|rekreasyon|hobi|rol|oyuna katılım)/.test(t)) return "kat";
  if (/(yürü|transfer|gya|bağımsız|merdiven|kalk|oturma|ayakta|uzanma|kullanım|ambulasyon|beceri|giyin|taşıma|kaldırma|mobilite|çömel|baş üstü|kavrama)/.test(t)) return "akt";
  return "bf";
}

   ["Nöromüsküler hastalıklar","Koruyucu-önleyici rol ön plandadır: submaksimal dirençli egzersiz, EHA, germe, solunum egzersizleri, aerobik, koordinasyon-propriosepsiyon, elektroterapi ve ortez. Ciddi zayıf kaslarda (< %10 normal) düzelme beklenmez. Limb girdle, FSHD, miyotonik distrofi tip 1 ve mitokondriyal miyopatide orta düzey kuvvet eğitimi güvenlidir; ALS'de yer çekimine karşı hareket edebilen kaslara düşük yoğunluklu kuvvet. Yüksek yoğunluklu eksantrik/konsantrik egzersiz Duchenne gibi hızlı progresif distrofilerde kullanılmaz. Solunum yetmezliği en sık mortalite nedenidir: solunum stratejileri, noninvaziv ventilasyon, havayolu temizleme."],

   ["Belirti-bulguların temel nedenleri","Lezyonun kitle etkisi (komşu dokulara bası, hücresel değişiklik, BOS dolaşımının bozulması, intrakraniyal basınç artışı, damarlara bası ile iskemi-nekroz), fonksiyonel etkisi (hücre içi/arası etkileşimin bozulması → nörolojik ve hormonal bulgular) ve direkt etkisi (travma)."],
   ["KİBAS: bulgular","Ana bulgular: bilinç düzeyinde bozulma (ajitasyon, letarji, oryantasyon bozukluğu), kusma, baş ağrısı, papil ödem. İleri bulgular: kraniyal sinir felçleri, çift görme, geçici görme kaybı, dekortike/deserebre postür, koma derinleşmesi, düzensiz solunum-apne, retinal hemoraji, pupil dilatasyonu, Cushing triadı (hipertansiyon, bradikardi, hipoventilasyon), nöbet, mental ve endokrin belirtiler, beyin herniasyonu.\n• Baş ağrısı: en sık belirti; gece uykuda (CO₂ artışı) kötüleşir; frontal-temporal, iki yanlı; ani postür değişikliği, ıkınma ve öksürmeyle artar.\n• Kusma: genellikle geç; ani, bulantısız, fışkırır tarzda; çocukta ve posterior fossa lezyonlarında daha sık.\n• Bilinç bozukluğu: son dönemlerde; önce apati ve ilgisizlik, sonra uyuklama, önce sözel sonra ağrılı uyarana yanıt bozulur."],
   ["KİBAS: destek tedavisi ve fizyoterapide pratik","Amaç İKB < 20 mmHg (erişkin normali 10–15; küçük çocuk 3–7; infant 1,5–6 mmHg). > 20 orta, > 40 mmHg şiddetli artış.\nGenel ilkeler: hava yolunun açık tutulması, yeterli oksijenizasyon ve hiperkapniden korunma, analjezi, venöz obstrüksiyonun-öksürmenin-eforun engellenmesi, başın yatak düzeyinden 30° yukarıda tutulması, gerekirse sedasyon, GKS < 8'de entübasyon.\nFizyoterapide: baş-boyun nötral ve 30° yukarıda; Valsalva, ıkınma, baş aşağı ve emekleme gibi pozisyonlardan kaçınma; seans öncesi-sırası bilinç ve vital izlemi."],
   ["Beyin ödemi","Beynin su miktarındaki artışa bağlı hacim artışı. Tipler: vazojenik (kan-beyin bariyeri yıkımı; tümör, apse – kortikosteroid), sitotoksik (hücre zarı hasarı; iskemi, toksinler), hidrostatik (artmış transmural basınç; AVM operasyonu sonrası), hipoozmotik (hiponatremi), interstisyel (obstrüktif hidrosefali – BOS drenajı, şant), beyin şişmesi (artmış kan hacmi)."],
   ["Bilinç düzeyleri","Normal bilinçlilik → konfüzyon (dikkatsizlik, dezoryantasyon; yakın hafıza en hassas test; gün içinde dalgalanır) → deliryum (konfüzyon + ajitasyon, illüzyon, halüsinasyon, otonom aktivite artışı) → letarji (uyaran kalkınca uykuya döner) → stupor (yalnız şiddetli-sürekli uyaranla uyanır, ağrıyı lokalize eder) → koma (semikoma: refleksler büyük ölçüde korunur; derin koma: hiçbir yanıt yok).\n• Vejetatif durum: uyku-uyanıklık döngüsü var, farkındalık yok; amaçlı-istemli yanıt yok; genellikle dekortike postür, inkontinans.\n• Locked-in sendromu: bilinç korunur; yalnızca vertikal bakış ve göz kırpma; kuadripleji (en sık baziler arter trombozu, pons lezyonu).\n• Akinetik mutizm: uyanık görünür ama sessiz-hareketsiz; gözler hareketli nesneleri izler."],

REHBER.push(
{id:"r_tonus", baslik:"Kas tonusu bozuklukları: spastisite, rijidite, distoni", ozet:"Ayırıcı özellikler, mekanizmalar, değerlendirme ve fizyoterapi yaklaşımları (kendi ders notlarından).",
 bolum:[
  ["Normal tonusun kontrolü","Spinal düzey: kas iğciği → Ia afferent → alfa motor nöron; gama sistemi iğcik duyarlılığını ayarlar; Renshaw ve Ia inhibitör internöronları antagonist gevşemesini düzenler.\nSupraspinal: kortikospinal yol (ince kontrol, inhibitör etki), retikülospinal (pontin: ekstansör tonus ↑; medüller: inhibitör), vestibülospinal (postüral tonus), serebellum ve bazal ganglionlar (modülasyon, adaptasyon)."],
  ["Karşılaştırma","• Spastisite: piramidal sistem/ÜMN; HIZ ve UZUNLUK BAĞIMLI; asimetrik (agonist-antagonist farklı); çakı bıçağı (clasp-knife); DTR ↑, klonus, Babinski (+). İnme, TBH, MS, OYY, SP.\n• Rijidite: bazal ganglionlar; hız ve yönden BAĞIMSIZ; agonist-antagonistte eşit; kurşun boru (lead-pipe) veya dişli çark (cogwheel – tremorla); refleksler normal, Babinski (−); kontralateral aktivite veya zihinsel görevle artar (aktivasyon manevrası). Parkinson'da %89–99.\n• Distoni: istemsiz, sürdürülen/aralıklı kasılma ve anormal postür; istemli hareketle artar, istirahatte azalabilir; sensörik hile (geste antagoniste)."],
  ["Spastisitenin mekanizması","ÜMN lezyonu → kortikospinal ve retikülospinal inhibisyon azalır → spinal refleks arkları disinhibe olur, Ia eşiği düşer → hız bağımlı tonus artışı. Uzun sürede mekanik (viskoelastik) bileşen eklenir: bağ doku artışı, sarkomer kaybı, kas kısalması. Bu nedenle pasif direnç hem nörojenik hem mekaniktir → Tardieu (R2–R1) ile ayırt edilir.\nSıklık: inme sonrası %20–40, SP'de > %60, OYY'de ~%40."],
  ["Değerlendirme","Pasif hareket direnci farklı hızlarda; Modifiye Ashworth (MAS), Modifiye Tardieu, EMG; sinerji paterni ve istemli hareket kalitesi; eşlik edenler: spazm, klonus, ko-kontraksiyon, kontraktür.\nRijiditede aktivasyon manevrası ile test; UPDRS madde 3.3; miyotonometri.\nDistonide BFMDRS, TWSTRS, UDRS; yüzey EMG."],
  ["Fizyoterapi yaklaşımları (spastisite)","• Germe (statik/ritmik): kas iğciği aktivitesini azaltır, uzunluğu korur.\n• Pozisyonlama: simetri ve uzamayı korur, refleks aktiviteyi azaltır.\n• Soğuk (10–15 dk lokal): sinir iletim hızını azaltır (kısa süreli).\n• Vibrasyon (50–100 Hz kısa süreli).\n• FES: zayıf antagoniste – resiprokal inhibisyon.\n• Aktif, görev temelli, tekrarlayıcı egzersiz: motor öğrenme.\n• Bobath/NDT: proksimal stabilizasyon, rotasyon, postüral kontrol.\n• Seri alçı/splint: kontraktür riskli eklemlerde.\nİlkeler: Spastisite her zaman ‘kötü’ değildir (postüral destek sağlayabilir); hedef tam gevşetme değil fonksiyonel tonus optimizasyonu; egzersiz ilacın pik etkisinde (ör. baklofen sonrası) ve BoNT sonrası 48–72 saat içinde planlanır."],
  ["Rijidite ve distoni için","Rijidite: büyük amplitüdlü, ritmik, rotasyonel hareketler (gövde rotasyonu), germe, ipuçlu yürüme, ON döneminde egzersiz; aksiyal rijidite dönme, oturma-kalkmayı zorlaştırır.\nDistoni: sensörimotor yeniden eğitim, görev odaklı pratik, postüral rehabilitasyon, EMG-biofeedback; sensörik hile terapiye entegre edilir."],
  ["Egzersiz parametrelerinin nörofizyolojik gerekçesi","• Tempo: yavaş eksantrik faz (3–5 sn) NMDA reseptörlerinin daha uzun açık kalmasıyla Ca²⁺ girişini ve LTP'yi destekler → motor öğrenme.\n• Tekrar sayısı: sinaptik iletimi güçlendirir (presinaptik Ca²⁺ akışı).\n• Setler arası dinlenme (2–5 dk): sinaptik vezikül havuzlarının yenilenmesi, sinaptik yorgunluğun önlenmesi.\n• Günler arası dinlenme (48–72 sa): aksonal taşıma ve uzun dönem adaptasyon.\n(Kaynak: Buse'nin ‘Nörofizyolojik temellere dayalı egzersiz protokollerinin oluşturulması’ notu – kavramsal çerçeve.)"]
 ]},
{id:"r_multifidus", baslik:"Kronik bel ağrısında multifidus fenotipleri (karar ağacı)", ozet:"US/MRI ile kas mimarisine göre egzersiz seçimi – Buse'nin çalışma notu (öneri niteliğinde çerçeve).",

  ["1. Başlangıç görüntüleme","US (L4–L5, bilateral): kas kalınlığı/CSA, dinamik kasılmada kalınlaşma oranı (%), ekojenite (gri skala). Varsa MRI Dixon PDFF (yağ infiltrasyonu %). Bilateral asimetri (% fark) not edilir."],
  ["2. Fenotip 1 – Atrofi baskın","CSA/kalınlık yaş-cinsiyet normlarının ~%20–25 altında; yağ düşük-orta; kasılma kalınlaşması sınırlı ama var. ‘Kas var ama hacim kaybetmiş.’ Pennasyon açısı ↓ → PCSA ↓.\nHedef: hipertrofi + kuvvet. Yöntem: izometrik → düşük hızlı izotonik, orta eklem açılarında yüksek gerilim."],
  ["3. Fenotip 2 – Yağ infiltrasyonu baskın","PDFF/ekojenite ↑, CSA normal-hafif ↓, kalınlaşma zayıf, dayanıklılık düşük. ‘Hacim korunmuş, kalite bozulmuş.’\nHedef: kas kalitesi + dayanıklılık + metabolik aktivasyon. Yöntem: düşük-orta şiddet, uzun süreli izometrik / düşük yük izotonik."],
  ["4. Fenotip 3 – Fonksiyonel inhibisyon baskın","CSA ve yağ görece normal; düşük yükte (ör. kontralateral kol kaldırma) kalınlaşma < %10–15; feedforward kontrol ve segmental stabilite zayıf. ‘Mimari iyi, sinir sistemi kası kullanmıyor.’\nHedef: zamanlama ve selektif aktivasyon. Yöntem: US biofeedback, düşük yükte motor kontrol (ör. TrA/multifidus aktivasyonu, kuş-köpek)."],
  ["5. Fenotip 4 – Mikst (en sık)","Hafif atrofi + hafif yağ + düşük aktivasyon. Sıralı yaklaşım: 1) aktivasyon 2) dayanıklılık 3) mimariye göre kuvvet (pennasyon çok düşükse) veya eksantrik/uzunluk odaklı faz (lif uzunluğu belirgin kısaysa)."],
  ["Uygulama notu","Her egzersizi tek tek ölçmek gerekmez; ilke temelli seçim + seçilen egzersizlerin hedeflenen kasılma davranışını ürettiğinin en az bir kez US ile doğrulanması (hibrit strateji). Bu çerçeve bir karar desteğidir; eşik değerler araştırma bağlamında doğrulanmalıdır."]

 bolum:[
  ["Fizyolojik farklar","• Aerobik kapasite (vücut ağırlığına göre VO₂maks) çocuklukta yaklaşık yetişkin düzeyindedir; anaerobik kapasite yaşla artar, ~16 yaşında yetişkin düzeyine ulaşır.\n• Kuvvet gelişimi nöromüsküler maturasyon, yaş, lif tipi ve hormon düzeyine bağlıdır; ergenlik öncesi kuvvet kazanımı büyük ölçüde nöral adaptasyondur.\n• Termal stres: çocuklar daha az terler, sıcağa daha yavaş alışır, kütleye göre vücut yüzeyi büyüktür → aşırı sıcak/soğukta egzersiz kısaltılır, sıvı alımı sağlanır."],
  ["Egzersiz seçimi","Kas-iskelet yapısına ve kognitif düzeye (dikkat, oryantasyon) uygun; motive edici (oyunlaştırılmış, takım/grup); çevresel ve sosyal etmenler ile çocuğun isteği dikkate alınır; doz fiziksel uygunluğa göre. Aşırı yüklenme yaralanmaya ve spora ilginin kaybına yol açar.\nKuvvetlendirme için ağırlık kaldırma şart değildir: vücut ağırlığıyla şınav, barfiks, mekik, hayvan yürüyüşleri, tırmanma; yetişkinlikte protokol dahilinde dirençli ve pliometrik eğitim."],
  ["Yaşa göre spor","2–3 yaş: koşma, yakalama, zıplama gibi temel hareketler. 4–6 yaş: dans, yüzme, jimnastik, ip atlama, sek sek, üç tekerlekli bisiklet. 7–10 yaş: jimnastik, yüzme, futbol, basketbol, voleybol, hentbol, bisiklet, tenis temel eğitimi. 10 yaş sonrası: organize spor, atletizm, güreş, kürek."],
  ["Postür ve okul","Çanta ağırlığı vücut ağırlığının %10–15'inden az, iki omuzda; uzun mesafede tekerlekli çanta. Sandalye boyu ayak tabanı yere 90° tam temas edecek şekilde; ergonomik sıra/masa. Uzun süre ekran, eğilerek oturma, hatalı ayakkabı ve fazla kilo duruş bozukluklarına katkı verir; yüzme önerilir. Postür değerlendirmesi: anatomik duruşta düzlemlere göre gözlem, kas kısalık testleri, EHA, kuvvet dengesi."]

 s_ashworth:{m:"—", t:"Kas grubu başına 1 dk",
  u:["Hasta sırtüstü, rahat ve gevşek; test edilecek eklem en kısalmış (fleksiyon) pozisyondan başlar.","Eklemi tüm EHA boyunca ~1 saniyede (‘bir bin bir’ sayarak) pasif olarak hareket ettirin.","Direncin ne zaman ve EHA'nın ne kadarında hissedildiğini değerlendirin.","Aynı hız, aynı pozisyon ve günün benzer saatinde tekrarlayın."],
  p:"0 tonus artışı yok · 1 EHA sonunda hafif takılma · 1+ EHA'nın < %50'sinde takılma ve minimal direnç · 2 EHA'nın çoğunda belirgin artış, hareket kolay · 3 belirgin artış, pasif hareket zor · 4 eklem rijit.", y:"Hız bağımlılığını ayırt edemez; dinamik ve mekanik bileşeni ayırmak için Modifiye Tardieu kullanılır. Değerlendiriciler arası güvenirlik orta düzeydedir.", n:"Ağrı, anksiyete, mesane doluluğu, soğuk ve pozisyon tonusu artırır; koşulları sabitleyin."},
 s_tardieu:{m:"Gonyometre", t:"Kas başına 2–3 dk",
  u:["Hasta standart pozisyonda (ör. dirsek fleksörleri için oturma, omuz addüksiyonda).","V1 – mümkün olan en yavaş pasif hareketle tam EHA'yı ölçün → R2.","V3 – mümkün olan en hızlı pasif hareketle germe yapın; ilk ‘yakalama’ (catch) açısını ölçün → R1.","Yakalamanın niteliğini 0–5 arası puanlayın (X)."],
  p:"R2 – R1 farkı derece olarak; ayrıca kas reaksiyon kalitesi X: 0 direnç yok, 1 hafif direnç, 2 belirli açıda net yakalama sonra bırakma, 3 yorulan klonus (< 10 sn), 4 yorulmayan klonus, 5 eklem hareketsiz.", y:"Büyük R2–R1 farkı → dinamik (refleks) bileşen baskın: germe, BoNT, FES gibi tonus yönetimi. Küçük fark ve düşük R2 → kontraktür: uzun süreli germe, seri alçı.", n:"Ölçüm pozisyonunu ve hızı her seferinde aynı tutun."},
 s_brunnstrom:{m:"—", t:"5–10 dk",
  u:["Kol, el ve alt ekstremiteyi ayrı ayrı değerlendirin.","Önce sinerjilerin varlığını, sonra sinerji dışı (selektif) hareketleri test edin.","Her segment için ulaşılan en yüksek evreyi kaydedin."],
  p:"1 flasidite, istemli hareket yok · 2 sinerjiler başlar, spastisite gelişir · 3 sinerjiler istemli, spastisite en yüksek · 4 sinerji dışı bazı hareketler, spastisite azalır · 5 daha zor sinerji dışı kombinasyonlar · 6 izole eklem hareketleri, koordinasyon normale yakın.", y:"Tedavi seçimine yön verir: erken evrelerde fasilitasyon, 3–4'te sinerjiden çıkış, 5–6'da beceri ve hız.", n:"Ordinal ve kaba bir ölçüdür; ayrıntılı takip için Fugl-Meyer kullanın."},
 s_fugl_ue:{m:"Masa, tenis topu, silindir, kâğıt, kalem, refleks çekici", t:"20–30 dk",
  u:["Hasta oturur. Bölümler: A omuz-dirsek-ön kol (refleksler, sinerji içi, sinerji karışık, sinerjiden bağımsız), B el bileği, C el, D koordinasyon/hız.","Her maddeyi önce sağlam tarafta gösterin, sonra etkilenen tarafta isteyin.","0 yapamaz, 1 kısmen, 2 tam yapar şeklinde puanlayın.","Koordinasyon maddesi (parmak-burun) için 5 tekrarın süresini karşılaştırın."],
  p:"Motor bölüm toplam 0–66 (A 36, B 10, C 14, D 6).", y:"< 32 ağır, 32–47 orta, 48–52 hafif-orta, > 52 hafif bozukluk (bir sınıflama). Subakut-kronik inmede MCID ≈ 4–7 (kronikte ~5,25).", n:"Duyu, EHA ve ağrı alt bölümleri ayrıca uygulanabilir."},
 s_fugl_ae:{m:"Yatak, sandalye, refleks çekici", t:"10–15 dk",
  u:["Refleksler ve sinerji içi hareketler sırtüstü; sinerji karışık hareketler oturarak; sinerjiden bağımsız hareketler ayakta test edilir.","Her madde 0–2 puanlanır.","Koordinasyon: topuk-diz testi 5 tekrar, süre sağlam tarafla karşılaştırılır."],
  p:"0–34.", y:"Yüksek puan daha iyi motor fonksiyon. Kronik inmede MCID ≈ 6 puan bildirilmiştir.", n:"Yürüme kapasitesini tek başına yansıtmaz; 10MYT ve Berg ile birlikte kullanın."},
 s_berg:{m:"Kronometre, 2 sandalye (kollu ve kolsuz), basamak/tabure, cetvel, yerde bir nesne", t:"15–20 dk",
  u:["14 madde sırayla uygulanır: oturmadan kalkma, desteksiz ayakta durma (2 dk), desteksiz oturma, ayaktan oturma, transfer, gözler kapalı durma, ayaklar bitişik durma, öne uzanma, yerden nesne alma, omuz üstünden geriye bakma, 360° dönme, basamağa ayak koyma (8 kez), tandem duruş, tek ayak üzerinde durma.","Her madde için talimatı tam olarak okuyun ve gösterin.","Maddeyi en düşük kriter karşılanınca puanlayın; birden fazla deneme hakkı varsa en iyisini alın."],
  p:"Her madde 0–4; toplam 0–56.", y:"< 45 düşme riski artmış (bazı çalışmalarda < 40–41); 0–20 tekerlekli sandalye, 21–40 yardımla yürüme, 41–56 bağımsız. MDC ≈ 4–7 (başlangıç puanına göre değişir).", n:"Yüksek fonksiyonlu hastada tavan etkisi vardır → FGA, Mini-BESTest tercih edin."},
 s_tug:{m:"Kollu sandalye (~46 cm), 3 m işaret, kronometre", t:"2 dk",
  u:["Hasta sırtı dayalı oturur, kendi ayakkabısı ve olağan yardımcı cihazıyla.","‘Başla’ denince kalkar, 3 m çizgiye normal ve güvenli hızda yürür, döner, geri gelir ve oturur.","Kronometre ‘başla’ ile başlar, sırt sandalyeye değince durur.","Bir deneme alıştırma, sonra ölçüm; gerekiyorsa bilişsel (geriye sayma) veya motor (bardak taşıma) çift görev versiyonunu ekleyin."],
  p:"Saniye.", y:"Toplumda yaşayan yaşlıda ≥ 13,5 sn düşme riski; Parkinson'da > 11,5 sn; inmede > 14 sn. < 10 sn normal hareketlilik.", n:"Yürüyüş kalitesini (adım, dönüş, donma) de gözlemleyin; süre tek başına yeterli değildir."},
 s_tinetti:{m:"Kolsuz sandalye, kronometre, 4–5 m yol", t:"10–15 dk",
  u:["Denge bölümü (9 madde): oturma dengesi, kalkma, kalkış denemeleri, ilk 5 sn ayakta denge, ayakta denge, itme (göğüse 3 hafif itme), gözler kapalı, 360° dönme, oturma.","Yürüme bölümü (7–8 madde): başlama, adım uzunluğu-yüksekliği, simetri, devamlılık, yol, gövde, yürüme genişliği.","Hasta kendi hızında ve gerekirse yardımcı cihazla yürür."],
  p:"Denge 0–16 + yürüme 0–12 = 0–28.", y:"< 19 yüksek düşme riski, 19–24 orta risk, 25–28 düşük risk.", n:"Hızlı bir tarama aracıdır; değişim için duyarlılığı sınırlıdır."},
 s_10m:{m:"14 m (veya 10 m + 2+2 m) düz koridor, kronometre", t:"3–5 dk",
  u:["Hasta ilk 2 m'yi hızlanma, son 2 m'yi yavaşlama için kullanır; ortadaki 10 m ölçülür (kronometre ayak işaret çizgisini geçince).","Rahat (olağan) hız ve/veya maksimum güvenli hızda; 2–3 deneme ortalaması.","Yardımcı cihaz ve ortez kaydedilir."],
  p:"m/sn = 10 / süre.", y:"< 0,4 m/sn ev içi, 0,4–0,8 sınırlı toplum, > 0,8 m/sn toplum içi ambulasyon (Perry, inme). ≥ 1,2 m/sn karşıdan karşıya güvenli geçiş için gerekir. MCID ≈ 0,10–0,16 m/sn.", n:"Hızlı yürüme hızı rezerv kapasiteyi gösterir; ikisini ayrı kaydedin."},
 s_6dyt:{m:"30 m düz koridor, koniler, kronometre, nabız oksimetre, Borg skalası, sandalye", t:"6 dk + dinlenme",
  u:["Öncesinde 10 dk oturarak dinlenme; KH, SpO₂, TA, dispne ve yorgunluk (Borg) ölçülür.","Talimat: ‘6 dakikada olabildiğince fazla mesafe yürüyün; koşmayın. Gerekirse yavaşlayıp durabilir, sonra devam edebilirsiniz.’","Her dakika standart cesaretlendirme cümleleri kullanın (‘İyi gidiyorsunuz, 5 dakika kaldı’).","Sonunda mesafe, KH, SpO₂, Borg ve duraklama sayısı kaydedilir."],
  p:"Metre.", y:"KOAH'ta MCID ≈ 25–35 m; kalp yetmezliğinde ~ 30–45 m. SpO₂ < %85 veya göğüs ağrısı, ciddi dispne, baş dönmesi, solukluk olursa test durdurulur.", n:"Kontrendikasyonlar: son 1 ayda kararsız angina/MI. Göreli: istirahat KH > 120, TA > 180/100."},
 s_30sts:{m:"Kolsuz, sırt destekli sandalye (~43–44 cm), kronometre", t:"1 dk",
  u:["Hasta kollarını göğüste çaprazlar, ayaklar yerde.","30 saniye boyunca tam ayağa kalkıp tam oturur; tekrar sayılır.","30. saniyede yarıdan fazla kalkmışsa sayılır."],
  p:"Tekrar sayısı.", y:"Yaşa göre normatif değerlerin altı (ör. 60–64 yaş kadın < 12, erkek < 14) alt ekstremite kuvvetinde azalma ve düşme riskini düşündürür. MCID ≈ 2 tekrar (diz OA).", n:"Kollarını kullanmak zorundaysa 0 puan verilir veya modifiye olarak not edilir."},
 s_5tsts:{m:"Kolsuz sandalye (~43 cm), kronometre", t:"1 dk",
  u:["Kollar göğüste çapraz; ‘olabildiğince hızlı 5 kez tam kalkıp oturun’.","Süre ‘başla’ ile başlar, 5. kalkışın sonunda (veya 5. oturuşta, protokole göre) durur."],
  p:"Saniye.", y:"Yaşlıda > 12–15 sn düşme riski; inmede > 12 sn; Parkinson'da > 16 sn. MCID ≈ 2,3 sn (vestibüler/KOAH).", n:"Kollarla destek gerekiyorsa test geçersizdir; not edin."},
 s_borg:{m:"6–20 Borg skalası kartı", t:"Egzersiz sırasında",
  u:["Kartı gösterin: 6 hiç zorlanma yok, 20 maksimal zorlanma.","Hastadan nefes darlığı, kas yorgunluğu ve genel zorlanmanın tamamını düşünerek bir sayı seçmesini isteyin."],
  p:"6–20.", y:"Orta şiddet 12–14 (‘biraz zor’); kardiyak rehabilitasyonda hedef çoğunlukla 11–14. Beta bloker kullananlarda KH yerine kullanılır.", n:"Puan × 10 kabaca KH'ye karşılık gelir (sağlıklı genç)."},
 s_mborg:{m:"0–10 modifiye Borg dispne kartı", t:"< 1 dk",
  u:["Egzersiz/test öncesi ve sonrası ‘nefes darlığınızı 0–10 arasında derecelendirin’."], p:"0 hiç – 10 maksimum (0,5 ara değer).", y:"Egzersiz reçetesinde dispne 3–5 (orta-biraz şiddetli) hedeflenir. MCID ≈ 1 puan.", n:""},
 s_mmrc:{m:"—", t:"< 1 dk",
  u:["Hastaya 5 ifadeyi okuyun; kendisine en uygun olanı seçsin."],
  p:"0 yalnızca ağır egzersizde · 1 hızlı yürürken/yokuşta · 2 yaşıtlarından yavaş yürür veya kendi hızında durmak zorunda kalır · 3 ~100 m'de ya da birkaç dakikada durur · 4 evden çıkamayacak kadar, giyinirken nefes darlığı.", y:"GOLD'da ≥ 2 ‘daha semptomatik’ grup. Pulmoner rehabilitasyon endikasyonunu destekler.", n:"Değişime duyarlılığı düşüktür; takipte CAT ve 6DYT kullanın."},
 s_cat:{m:"CAT formu (Türkçe)", t:"2–3 dk",
  u:["8 madde (öksürük, balgam, göğüste sıkışma, yokuş/merdivende nefes darlığı, ev aktiviteleri, evden çıkma güveni, uyku, enerji) hasta tarafından 0–5 puanlanır."],
  p:"0–40.", y:"< 10 düşük, 10–20 orta, 21–30 yüksek, > 30 çok yüksek etki. MCID ≈ 2 puan.", n:""},
 s_oswestry:{m:"ODI formu (Türkçe, v2.1)", t:"5 dk",
  u:["10 bölüm (ağrı şiddeti, kişisel bakım, kaldırma, yürüme, oturma, ayakta durma, uyku, cinsel yaşam, sosyal yaşam, seyahat), her biri 0–5.","Hasta formu kendisi doldurur.","Puan = (toplam / (5 × yanıtlanan bölüm)) × 100."],
  p:"% 0–100.", y:"0–20 minimal, 21–40 orta, 41–60 ciddi, 61–80 sakat edici, 81–100 yatağa bağımlı veya abartma. MCID ≈ 10 puan (veya %30).", n:"Cevaplanmayan bölüm paydadan çıkarılır."},
 s_ndi:{m:"NDI formu (Türkçe)", t:"5 dk",
  u:["10 bölüm (ağrı, kişisel bakım, kaldırma, okuma, baş ağrısı, konsantrasyon, iş, araba kullanma, uyku, rekreasyon), her biri 0–5; hasta doldurur."],
  p:"0–50 (veya %).", y:"0–4 yok, 5–14 hafif, 15–24 orta, 25–34 ciddi, > 34 tam disabilite. MCID ≈ 7,5 puan (~%15).", n:""},
 s_dash:{m:"DASH (30 madde) veya QuickDASH (11 madde) formu", t:"5–10 dk",
  u:["Hasta son bir haftadaki zorluğu 1–5 arası işaretler.","Puan = [(toplam / yanıt sayısı) − 1] × 25. QuickDASH'te en az 10 madde yanıtlanmalıdır."],
  p:"0–100 (yüksek = daha fazla disabilite).", y:"MCID ≈ 10–15 puan (DASH), ~ 8–14 (QuickDASH).", n:"İş ve spor/müzik modülleri isteğe bağlıdır, ayrı puanlanır."},
 s_womac:{m:"WOMAC formu (Türkçe, Likert)", t:"10 dk",
  u:["24 madde: ağrı (5), tutukluk (2), fiziksel fonksiyon (17); son 48 saat için 0–4 puanlanır."],
  p:"Toplam 0–96 (alt ölçekler ayrı raporlanabilir; normalize % kullanılabilir).", y:"Yüksek puan daha kötü. MCID ≈ toplamın %12–18'i; fonksiyon alt ölçeğinde ~ 6 puan.", n:""},
 s_lysholm:{m:"Lysholm formu", t:"3–5 dk",
  u:["8 madde: topallama (5), destek (5), kilitlenme (15), instabilite (25), ağrı (25), şişlik (10), merdiven (10), çömelme (5)."],
  p:"0–100.", y:"95–100 mükemmel, 84–94 iyi, 65–83 orta, < 65 kötü. MDC ≈ 9–10 puan (ÖÇB).", n:"Bağ ve menisküs yaralanmalarında kullanılır."},
 s_cobb:{m:"Ayakta ön-arka grafi, açıölçer veya dijital araç", t:"—",
  u:["Eğriliğin üst ve alt uç vertebralarını (en çok eğimli) belirleyin.","Üst uç vertebranın üst plağına ve alt uç vertebranın alt plağına çizgiler çizin; dikmelerinin kesiştiği açıyı ölçün.","Klinikte izlem için skolyometre ile gövde rotasyon açısı (ATR) kullanılabilir (Adams öne eğilme testi)."],
  p:"Derece.", y:"≥ 10° skolyoz; 10–25° izlem/egzersiz (Schroth vb.), 25–40/45° korse (büyüme devam ediyorsa), > 45–50° cerrahi değerlendirme. ≥ 5° değişim anlamlı kabul edilir (ölçüm hatası ~3–5°).", n:"Skolyometrede ATR ≥ 5–7° grafi için sevk kriteridir."},
 s_fim:{m:"FIM puanlama kılavuzu (eğitimli değerlendirici)", t:"30–45 dk",
  u:["18 madde: motor 13 (öz bakım 6, sfinkter 2, transfer 3, lokomosyon 2), bilişsel 5 (iletişim 2, sosyal biliş 3).","Hastanın gerçekte YAPTIĞI performans gözlem veya bakım veren bilgisiyle puanlanır."],
  p:"Her madde 1 (tam yardım) – 7 (tam bağımsız); toplam 18–126.", y:"Motor alt ölçek MCID ≈ 17, bilişsel ≈ 3 (inme, bir çalışma). 18 tam bağımlı, 126 tam bağımsız.", n:"Lisanslı bir ölçektir; klinikte resmi eğitim önerilir."},
 s_barthel:{m:"Barthel formu", t:"5–10 dk",
  u:["10 aktivite: beslenme, banyo, kişisel bakım, giyinme, bağırsak, mesane, tuvalet kullanımı, transfer, mobilite, merdiven.","Hastanın gerçek performansı puanlanır (yapabilecekleri değil)."],
  p:"0–100 (5'er puanlık basamaklar).", y:"0–20 tam bağımlı, 21–60 ileri, 61–90 orta, 91–99 hafif bağımlı, 100 bağımsız. MCID ≈ 9–10 puan (inme).", n:"Tavan etkisi vardır; toplumda yaşayan hastada IADL ölçeği ekleyin."},
 s_hy:{m:"—", t:"< 1 dk",
  u:["Öykü ve muayene ile tutulum tarafını, aksiyel tutulumu ve postüral instabiliteyi belirleyin.","Postüral instabilite için çekme testi (pull test): hasta ayakta, arkasından omuzlarından ani geri çekme; 2 adımdan fazla geri adım veya düşme eğilimi anormal."],
  p:"1 – 5 (1,5 ve 2,5 modifiye ara evreler).", y:"Evre 1–2,5 erken, 3 orta (postüral instabilite başlar, düşme riski artar), 4–5 ileri. Fizyoterapi hedefleri evreye göre seçilir (KNGF rehberi).", n:"ON/OFF durumunu kaydedin."},
 s_updrs3:{m:"Resmi MDS-UPDRS formu (Türkçe resmi çeviri), kronometre, sandalye", t:"15–20 dk",
  u:["33 puanlık madde (18 başlık): konuşma, yüz ifadesi, rijidite (5 bölge), parmak vurma, el hareketleri, pronasyon-supinasyon, ayak parmağı vurma, bacak çevikliği, sandalyeden kalkma, yürüme, donma, postüral stabilite (çekme testi), postür, global spontanlık, postüral ve kinetik tremor, istirahat tremoru amplitüdü ve sürekliliği.","Her madde 0 normal – 4 ağır.","İlaç durumunu (ON/OFF), son levodopa saatini ve diskinezi varlığını kaydedin."],
  p:"0–132.", y:"MCID ≈ 3,25 puan iyileşme, 4,6 kötüleşme (Horváth 2015).", n:"Rijidite muayenesinde aktivasyon manevrası (karşı elle aç-kapa) kullanılabilir."},
 s_edss:{m:"Nörolojik muayene + yürüme mesafesi", t:"20–30 dk (hekim)",
  u:["8 fonksiyonel sistem (piramidal, serebellar, beyin sapı, duyu, barsak-mesane, görme, serebral, diğer) puanlanır.","Yürüme mesafesi ve yardım ihtiyacı belirlenir; 4,0 üzeri skorlar büyük ölçüde ambulasyona dayanır."],
  p:"0–10 (0,5 basamak).", y:"0–3,5 tam ambulatuar, 4,0–5,5 yürüme mesafesi kısıtlı (yardımsız 500–100 m), 6,0 tek taraflı destekle 100 m, 6,5 iki taraflı destek, 7,0+ tekerlekli sandalye. EDSS < 6 iken artış ≥ 1,0; ≥ 6'da ≥ 0,5 anlamlı ilerleme.", n:"Genellikle nörolog tarafından verilir; fizyoterapist sonucu kaydeder."},
 s_asia:{m:"ISNCSCI formu, iğne ve pamuk", t:"30–45 dk",
  u:["28 dermatomda her iki tarafta hafif dokunma ve iğne batma (0 yok, 1 bozuk, 2 normal).","10 anahtar kasta (C5–T1, L2–S1) MMT 0–5.","Derin anal basınç ve istemli anal kontraksiyon (sakral korunma).","Duyusal ve motor seviyeleri, nörolojik seviyeyi ve AIS derecesini belirleyin."],
  p:"A komplet (S4–5'te duyu/motor yok) · B duyu inkomplet · C motor inkomplet, seviye altındaki kasların yarıdan fazlası < 3 · D motor inkomplet, yarısı ya da fazlası ≥ 3 · E normal.", y:"İlk 72 saat–1 haftada yapılan değerlendirme prognozu belirler; inkomplet lezyonlarda (özellikle iğne batma korunmuşsa) yürüme prognozu daha iyidir.", n:"Seviyeyi not alanına yazın (ör. C6 AIS B)."},
 s_gks:{m:"—", t:"2 dk",
  u:["Göz açma: 4 spontan, 3 sese, 2 ağrıya, 1 yok.","Sözel yanıt: 5 oryante, 4 konfüze, 3 uygunsuz kelimeler, 2 anlaşılmaz sesler, 1 yok.","Motor yanıt: 6 emre uyar, 5 ağrıyı lokalize eder, 4 ağrıdan çeker, 3 anormal fleksiyon (dekortike), 2 ekstansiyon (deserebre), 1 yok."],
  p:"3–15.", y:"13–15 hafif, 9–12 orta, ≤ 8 ağır beyin hasarı (koma, havayolu koruması gerekebilir).", n:"Entübe hastada sözel ‘T’ olarak not edilir."},
 s_hb:{m:"—", t:"2–3 dk",
  u:["İstirahatte yüz simetrisini gözleyin.","Kaş kaldırma, gözleri hafif ve sıkı kapama, gülümseme, dudak büzme hareketlerini isteyin; sinkinezi, kontraktür ve spazmı not edin."],
  p:"I normal · II hafif disfonksiyon · III orta (belirgin asimetri, göz efor ile kapanır) · IV orta-ağır (göz tam kapanmaz) · V ağır (hafif hareket) · VI tam paralizi.", y:"Bell paralizisinde çoğu hasta 3–6 ayda düzelir; 3 haftada hiç düzelme olmaması kötü prognoz işaretidir.", n:"Ayrıntılı takip için Sunnybrook skalası tercih edilebilir."},
 s_gmfcs:{m:"GMFCS E&R yaş bantları tanımları", t:"Gözlem",
  u:["Çocuğun olağan ortamdaki (ev, okul, toplum) performansını, yaş bandına (< 2, 2–4, 4–6, 6–12, 12–18) uygun tanımla eşleştirin.","‘En iyi kapasite’ değil, günlük yaşamdaki olağan performans esas alınır."],
  p:"I sınırlama olmadan yürür · II sınırlamalarla yürür · III el ile tutulan yardımcı cihazla yürür · IV kendi kendine hareketi sınırlı, tekerlekli sandalye (güçlendirilmiş) kullanabilir · V elle itilen tekerlekli sandalyede taşınır.", y:"Prognoz ve hedef belirlemede kullanılır (GMFM motor gelişim eğrileri GMFCS düzeyine göredir).", n:"2 yaş altında sınıflama daha az kararlıdır; tekrar değerlendirin."},

 {id:"t_spurling", ad:"Spurling testi", b:"servikal", a:"Servikal radikülopati", u:["Hasta oturur; boyun ekstansiyon ve semptomlu tarafa lateral fleksiyonda (± rotasyon).","Terapist başın üzerinden aşağı doğru dikkatli aksiyel kompresyon uygular."], poz:"Kola yayılan dermatomal ağrı/parestezi (sadece boyun ağrısı pozitif sayılmaz).", y:"Özgüllük yüksek (~%90+), duyarlılık orta. Wainner kümesi: Spurling (+), distraksiyon (+), ULTT-A (+), etkilenen tarafa rotasyon < 60° → 4'ü pozitifse radikülopati olasılığı çok yüksek."},
 {id:"t_distraksiyon", ad:"Servikal distraksiyon testi", b:"servikal", a:"Servikal radikülopati (foramen açılmasıyla rahatlama)", u:["Hasta sırtüstü; terapist oksiput ve çeneden kavrayıp ~ 6–7 kg kuvvetle yavaş traksiyon uygular."], poz:"Kol semptomlarının azalması.", y:"Özgüllük yüksek (~%90). Pozitifse servikal traksiyondan fayda görme olasılığı artar."},
 {id:"t_ultt", ad:"Üst ekstremite nöral gerim testi (ULTT1 – median)", b:"servikal", a:"Median sinir / servikal kök mekanosensitivitesi", u:["Sırtüstü; sırasıyla: skapula depresyonu, omuz abdüksiyonu (~110°), ön kol supinasyonu, el bileği ve parmak ekstansiyonu, omuz dış rotasyonu, dirsek ekstansiyonu.","Duyarlılaştırma: boynun karşı tarafa lateral fleksiyonu (semptom artar), aynı tarafa (azalır)."], poz:"Hastanın semptomlarının yeniden üretilmesi, taraflar arası ≥ 10° dirsek ekstansiyon farkı ve yapısal farklılaştırmayla değişen yanıt.", y:"Duyarlılık çok yüksek (~%95), özgüllük düşük: negatifse servikal radikülopatiyi dışlamaya yardımcıdır."},
 {id:"t_slr", ad:"Düz bacak kaldırma (Lasègue / SLR)", b:"lomber", a:"Lomber disk hernisi / L5–S1 kök irritasyonu", u:["Sırtüstü; terapist dizi ekstansiyonda tutarak bacağı pasif olarak kaldırır.","Semptom başladığında bacağı birkaç derece indirip ayak bileğini dorsifleksiyona getirin (Bragard) veya boyun fleksiyonu ekleyin (yapısal farklılaştırma)."], poz:"30–70° arasında dizin altına yayılan bacak ağrısının yeniden üretilmesi.", y:"Duyarlılık yüksek (~%90), özgüllük düşük (~%25). Sadece arka uylukta gerginlik hamstring kısalığıdır, pozitif sayılmaz."},
 {id:"t_cslr", ad:"Çapraz düz bacak kaldırma (crossed SLR)", b:"lomber", a:"Büyük/sekestre disk hernisi", u:["Sağlam bacak kaldırılır."], poz:"Etkilenen bacakta ağrı.", y:"Özgüllük yüksek (~%90), duyarlılık düşük (~%30)."},
 {id:"t_slump", ad:"Slump testi", b:"lomber", a:"Nöral doku mekanosensitivitesi (lomber radikülopati)", u:["Hasta masa kenarında oturur, elleri arkada; sırasıyla torakolomber fleksiyon (çökme), boyun fleksiyonu, diz ekstansiyonu, ayak bileği dorsifleksiyonu.","Semptom olursa boyun fleksiyonu bırakılır (desensitizasyon)."], poz:"Hastanın semptomlarının üretilmesi ve boyun hareketiyle değişmesi.", y:"Duyarlılığı SLR'den yüksek bildirilmiştir (~%84); nöropatik bileşeni olan bel ağrısında yararlıdır."},
 {id:"t_femoral", ad:"Femoral sinir germe (prone knee bend)", b:"lomber", a:"Üst lomber (L2–L4) kök irritasyonu", u:["Yüzüstü; terapist dizi pasif fleksiyona götürür (± kalça ekstansiyonu)."], poz:"Uyluk önünde ağrı/parestezi.", y:"Rektus femoris gerginliğinden ayırt edin (yalnızca germe hissi)."},
 {id:"t_prone_inst", ad:"Yüzüstü instabilite testi", b:"lomber", a:"Lomber segmental instabilite – stabilizasyon egzersizinden yarar görme", u:["Gövde masada, ayaklar yerde; terapist ağrılı segmente posterior-anterior bası uygular.","Hasta bacaklarını yerden kaldırıp (kalça ekstansörleri kasılı) bası tekrar edilir."], poz:"İlk pozisyonda ağrı olup kas aktivasyonuyla azalması.", y:"Hicks klinik tahmin kuralı: yaş < 40, SLR > 91°, aberran hareketler, pozitif yüzüstü instabilite → stabilizasyon egzersizi başarısını öngörür."},
 {id:"t_si_kume", ad:"Sakroiliak provokasyon kümesi (Laslett)", b:"lomber", a:"Sakroiliak eklem kaynaklı ağrı", u:["5 test: distraksiyon (ASIS'lere posterolateral bası), kompresyon (yan yatışta iliak kanata bası), uyluk itme (thigh thrust – 90° kalça fleksiyonunda femur boyunca bası), sakral itme (yüzüstü sakruma bası), Gaenslen (bir kalça hiperekstansiyonda diğeri fleksiyonda)."], poz:"Hastanın bilinen ağrısının yeniden üretilmesi.", y:"5 testten ≥ 3'ü pozitif (veya distraksiyon, uyluk itme, kompresyon, sakral itmeden ≥ 2'si) SİE ağrısı olasılığını artırır; önce McKenzie değerlendirmesiyle diskojenik ağrı dışlanmalıdır."},
 {id:"t_faber", ad:"FABER (Patrick) testi", b:"kalca", a:"Kalça eklemi, SİE veya iliopsoas patolojisi", u:["Sırtüstü; test edilen bacak fleksiyon-abdüksiyon-dış rotasyonda ‘4’ pozisyonu, ayak karşı dizin üstünde.","Terapist karşı ASIS'i stabilize ederek dize aşağı doğru bası uygular."], poz:"Kasıkta ağrı (kalça eklemi) veya arka pelviste ağrı (SİE); dizin karşı tarafa göre yüksek kalması (kısıtlılık).", y:"Ağrının yeri ayırıcı tanıya yardım eder; tek başına özgül değildir."},
 {id:"t_fadir", ad:"FADIR (anterior sıkışma) testi", b:"kalca", a:"Femoroasetabular sıkışma / labral yırtık", u:["Sırtüstü; kalça 90° fleksiyon, addüksiyon ve iç rotasyona götürülür."], poz:"Kasıkta tanıdık ağrı.", y:"Duyarlılık çok yüksek (~%90+), özgüllük düşük: negatifse FAİ/labral patoloji olasılığı azalır."},
 {id:"t_thomas", ad:"Thomas testi", b:"kalca", a:"Kalça fleksör (iliopsoas, rektus femoris, TFL) kısalığı", u:["Hasta masanın ucunda oturur, sırtüstü yatarken iki dizini göğsüne çeker; bel düzleşir.","Test edilen bacak serbestçe aşağı sarkıtılır, diğeri göğüste tutulur."], poz:"Uyluk masaya inmez (iliopsoas); diz 80°'den az fleksiyonda (rektus femoris); uyluk abdüksiyona kaçar (TFL/İTB).", y:"Modifiye Thomas'ta açılar gonyometre ile ölçülebilir."},
 {id:"t_ober", ad:"Ober testi", b:"kalca", a:"İliotibial bant / TFL kısalığı", u:["Yan yatış, alttaki bacak fleksiyonda; terapist üstteki bacağı diz 90° (Ober) veya ekstansiyonda (modifiye) iken kalçayı abdüksiyon-ekstansiyona alır ve yavaşça bırakır."], poz:"Bacak addüksiyona (masaya doğru) inemez.", y:"Pelvisin geriye kaçmasını engelleyin; yanlış negatife yol açar."},
 {id:"t_trendelenburg", ad:"Trendelenburg testi", b:"kalca", a:"Gluteus medius zayıflığı / kalça patolojisi", u:["Hasta test edilen bacak üzerinde 30 sn tek ayakta durur; karşı kalça ve diz fleksiyonda."], poz:"Karşı taraf pelvisin düşmesi (ya da gövdenin destek tarafına aşırı eğilmesi – kompanse Trendelenburg).", y:"Yürüyüşte gözlenen Trendelenburg/Duchenne paterniyle birlikte yorumlayın; TKA sonrası ve gluteal tendinopatide sık."},
 {id:"t_lachman", ad:"Lachman testi", b:"diz", a:"Ön çapraz bağ (ÖÇB) yırtığı", u:["Sırtüstü, diz 20–30° fleksiyonda; terapist bir eliyle femur distalini stabilize eder, diğeriyle tibia proksimalini öne doğru çeker.","Anterior translasyon miktarı ve son his karşı tarafla karşılaştırılır."], poz:"Artmış anterior translasyon ve yumuşak/belirsiz son his.", y:"ÖÇB için en doğru klinik test: duyarlılık ~%80–85, özgüllük ~%90+. Akut dönemde kas koruması yanlış negatif yapabilir."},
 {id:"t_on_cekmece", ad:"Ön çekmece testi (diz)", b:"diz", a:"ÖÇB yırtığı", u:["Sırtüstü, kalça 45°, diz 90° fleksiyonda; terapist ayağı sabitler (üzerine oturur).","Tibia proksimalinden iki elle öne doğru çeker; hamstringlerin gevşek olduğunu kontrol eder."], poz:"Karşı tarafa göre artmış anterior translasyon.", y:"Kronik yırtıklarda daha iyi; akutta Lachman'dan daha az duyarlı."},
 {id:"t_pivot", ad:"Pivot shift testi", b:"diz", a:"ÖÇB yetmezliği – anterolateral rotasyonel instabilite", u:["Sırtüstü, diz ekstansiyonda; terapist tibiaya iç rotasyon ve valgus uygulayarak dizi fleksiyona getirir."], poz:"~30–40° fleksiyonda lateral tibia platosunun redükte olduğu ‘sıçrama/klunk’.", y:"Özgüllük çok yüksek (~%98), duyarlılık düşük (uyanık hastada koruma). Pozitifse ÖÇB yırtığı kuvvetle olasıdır."},
 {id:"t_arka_cekmece", ad:"Arka çekmece ve posterior sag", b:"diz", a:"Arka çapraz bağ (AÇB) yırtığı", u:["Ön çekmece pozisyonunda tibia proksimali arkaya itilir.","Sag: kalça ve diz 90°'de tibia tuberositasının karşı tarafa göre geride kalması gözlenir."], poz:"Artmış posterior translasyon / tibianın aşağı sarkması.", y:"Duyarlılık ve özgüllük yüksek (~%90). Ön çekmeceden önce sag'a bakın; aksi halde AÇB yırtığı yanlışlıkla ön çekmece pozitifliği gibi görünebilir."},
 {id:"t_valgus", ad:"Valgus ve varus stres testleri", b:"diz", a:"Medial (MKL) / lateral (LKL) kollateral bağ yaralanması", u:["Diz 0° ve 30° fleksiyonda; femur stabilize edilip tibiaya valgus (MKL) veya varus (LKL) kuvvet uygulanır."], poz:"Ağrı ve/veya artmış eklem aralığı açılması.", y:"30°'de laksite izole kollateral bağ; 0°'de de laksite eşlik eden çapraz bağ/kapsül yaralanmasını düşündürür. Derece I–III."},
 {id:"t_mcmurray", ad:"McMurray testi", b:"diz", a:"Menisküs yırtığı", u:["Sırtüstü, diz tam fleksiyonda; terapist bir eliyle eklem çizgisini palpe eder.","Medial menisküs: tibia dış rotasyon + valgus ile diz ekstansiyona getirilir. Lateral: iç rotasyon + varus."], poz:"Eklem çizgisinde ağrılı ‘klik’ veya ‘tık’.", y:"Özgüllük orta-yüksek (~%70–90), duyarlılık düşük-orta. Eklem çizgisi hassasiyeti ve Thessaly ile birlikte değerlendirin."},
 {id:"t_thessaly", ad:"Thessaly testi", b:"diz", a:"Menisküs yırtığı (yük altında)", u:["Hasta terapistin ellerinden tutunarak tek ayak üzerinde, diz 20° fleksiyonda durur.","Gövdesini ve dizini 3 kez iç ve dış rotasyona döndürür; önce sağlam bacakla gösterilir."], poz:"Eklem çizgisinde ağrı, kilitlenme veya takılma hissi.", y:"İlk çalışmalarda yüksek doğruluk bildirilmiş; sonraki çalışmalarda daha mütevazı. Akut ve ağrılı dizde dikkatli uygulayın."},
 {id:"t_eklem_cizgisi", ad:"Eklem çizgisi hassasiyeti", b:"diz", a:"Menisküs yırtığı", u:["Diz 90° fleksiyonda medial ve lateral eklem çizgileri boyunca palpasyon."], poz:"Lokal belirgin hassasiyet.", y:"Duyarlılık ~%75–85, özgüllük orta; kombine klinik muayene (öykü: kilitlenme, takılma + testler) tek testten daha doğrudur."},
 {id:"t_patellar_kaygi", ad:"Patellar kaygı (apprehension) testi", b:"diz", a:"Patellar instabilite / geçirilmiş patella çıkığı", u:["Diz 20–30° fleksiyonda, quadriceps gevşek; terapist patellayı laterale iter."], poz:"Hastanın kaygı duyması ve quadricepsi kasması.", y:"Patella çıkığı öyküsüyle birlikte yorumlanır. Patellofemoral ağrıda tek tanısal test yoktur; ‘çömelme ağrısı’ en duyarlı bulgudur."},
 {id:"t_ab_on_cekmece", ad:"Ayak bileği ön çekmece testi", b:"ayak", a:"Anterior talofibular ligament (ATFL) yaralanması", u:["Ayak bileği ~10–20° plantar fleksiyonda; terapist tibiayı stabilize eder, topuktan kavrayarak talusu öne çeker."], poz:"Karşı tarafa göre artmış anterior translasyon, belirsiz son his.", y:"Akut ödemde zor uygulanır; travmadan 4–5 gün sonra muayene daha doğrudur (duyarlılık ~%96, özgüllük ~%84, van Dijk)."},
 {id:"t_talar_tilt", ad:"Talar tilt testi", b:"ayak", a:"Kalkaneofibular ligament (CFL) yaralanması", u:["Ayak bileği nötralde; kalkaneusa inversiyon kuvveti uygulanır."], poz:"Artmış inversiyon açıklığı ve ağrı.", y:"ATFL ile birlikte CFL yaralanması daha ciddi (derece II–III) burkulmayı gösterir."},
 {id:"t_squeeze", ad:"Squeeze (sıkıştırma) testi", b:"ayak", a:"Syndesmoz (yüksek ayak bileği) yaralanması", u:["Terapist bacağın orta kısmında tibia ve fibulayı birbirine doğru sıkıştırır."], poz:"Distal tibiofibular bölgede ağrı.", y:"Dış rotasyon testiyle birlikte kullanılır; syndesmoz yaralanması dönüşü uzatır. Ottawa kurallarına göre kırık şüphesinde grafi."},
 {id:"t_thompson", ad:"Thompson testi", b:"ayak", a:"Aşil tendonu tam rüptürü", u:["Hasta yüzüstü, ayaklar masa dışında; terapist baldırı sıkar."], poz:"Ayakta plantar fleksiyon hareketi oluşmaz.", y:"Tam rüptür için duyarlılık ve özgüllük yüksek (~%96/93). Matles (dizler 90°'de ayağın nötral/dorsifleksiyonda kalması) eşlik eder."},
 {id:"t_windlass", ad:"Windlass testi", b:"ayak", a:"Plantar fasiit", u:["Hasta ayakta (veya oturarak); terapist başparmağı pasif dorsifleksiyona götürür."], poz:"Topukta/medial kalkaneal tüberkülde ağrı.", y:"Özgüllük yüksek, duyarlılık düşük. Sabah ilk adım ağrısı ve palpasyonla birlikte."},
 {id:"t_ottawa", ad:"Ottawa ayak bileği kuralları", b:"ayak", a:"Grafi gerekliliği (kırık şüphesi)", u:["Malleol bölgesinde ağrı + lateral veya medial malleolün arka kenarında/ucunda (distal 6 cm) kemik hassasiyeti ya da hemen sonrasında ve muayenede 4 adım yük verememe → ayak bileği grafisi.","Orta ayak ağrısı + 5. metatars tabanı veya naviküler hassasiyeti ya da 4 adım yük verememe → ayak grafisi."], poz:"Kriterlerden biri varsa grafi önerilir.", y:"Duyarlılık ~%98–100: negatifse kırık olasılığı çok düşüktür."},
 {id:"t_adams", ad:"Adams öne eğilme testi", b:"lomber", a:"Skolyoz taraması (yapısal eğrilik)", u:["Hasta ayakta, dizler düz, kollar sarkık şekilde öne eğilir.","Terapist arkadan sırtın simetrisine bakar; skolyometre ile gövde rotasyon açısı (ATR) ölçülür."], poz:"Kaburga kamburu (hump) veya lomber kabarıklık; ATR ≥ 5–7°.", y:"Pozitifse ayakta ön-arka grafi ile Cobb açısı ölçülür."},
 {id:"t_romberg", ad:"Romberg ve keskin (sharpened) Romberg", b:"noro", a:"Propriosepsiyon ve vestibüler katkı – duyusal ataksi", u:["Ayaklar bitişik, kollar yanda; önce gözler açık, sonra kapalı 30 sn durma.","Keskin Romberg: tandem duruşta aynı test."], poz:"Gözler kapanınca belirgin salınım veya denge kaybı (gözler açıkken iyi).", y:"Pozitif Romberg duyusal (proprioseptif) ataksiyi gösterir; serebellar atakside gözler açıkken de denge bozuktur."},
 {id:"t_dix", ad:"Dix-Hallpike testi", b:"noro", a:"Posterior kanal BPPV", u:["Hasta uzun oturur, baş test tarafına 45° döndürülür.","Hızla sırtüstü yatırılır, baş masa kenarından ~20–30° ekstansiyonda; 30–60 sn gözlenir.","Oturur pozisyona dönülür; diğer taraf test edilir."], poz:"Birkaç saniyelik latans sonrası, < 1 dk süren, yukarı vuran torsiyonel (alttaki kulağa doğru) nistagmus ve vertigo.", y:"Pozitifse aynı tarafa Epley manevrası. Boyun patolojisi, vertebrobaziler yetmezlik ve ağır kardiyak hastalıkta dikkat."},
 {id:"t_roll", ad:"Supine roll (Pagnini-McClure) testi", b:"noro", a:"Horizontal (lateral) kanal BPPV", u:["Hasta sırtüstü, baş 30° fleksiyonda; baş hızla bir yana ~90° çevrilir, sonra ortaya ve diğer yana."], poz:"Horizontal nistagmus (jeotropik veya apojeotropik); daha şiddetli taraf genellikle etkilenen taraf (jeotropikte).", y:"Pozitifse BBQ roll (Lempert) veya Gufoni manevrası."},
 {id:"t_hit", ad:"Baş impuls testi (HIT)", b:"noro", a:"Periferik vestibüler hipofonksiyon (VOR)", u:["Hasta terapistin burnuna odaklanır; baş küçük amplitüdlü (10–20°), hızlı ve öngörülemeyen şekilde sağa veya sola çevrilir."], poz:"Gözlerin hedeften kayıp ardından düzeltici sakkad yapması (çevrilen tarafta hipofonksiyon).", y:"Akut vertigoda HINTS (baş impuls, nistagmus tipi, skew) inmeyi periferik nedenden ayırmaya yardımcı olur: normal HIT + yön değiştiren nistagmus + skew → merkezi neden şüphesi (acil)."},
 {id:"t_babinski", ad:"Babinski (plantar) yanıtı", b:"noro", a:"Üst motor nöron (kortikospinal yol) lezyonu", u:["Ayak tabanının lateralinden topuktan başlayarak metatars başlarına doğru künt bir uçla yavaşça çizilir."], poz:"Başparmak dorsifleksiyonu ± diğer parmakların yelpazelenmesi (ekstansör plantar yanıt).", y:"1–2 yaş altında normal kabul edilebilir. Hoffmann (üst ekstremite) ve klonus ile birlikte ÜMN bulgularını destekler."},
 {id:"t_klonus", ad:"Ayak bileği klonusu", b:"noro", a:"Hiperrefleksi / ÜMN lezyonu", u:["Diz hafif fleksiyonda; terapist ayağı hızla dorsifleksiyona iter ve bu pozisyonda tutar."], poz:"Ritmik plantar fleksiyon kasılmaları: ≤ 3–4 vuru tükenen veya sürekli (≥ 5) klonus.", y:"Sürekli klonus patolojiktir; spastisitenin bileşenidir (Tardieu X puanı 3–4)."},
 {id:"t_hoffmann", ad:"Hoffmann işareti", b:"noro", a:"Servikal miyelopati / ÜMN lezyonu", u:["Terapist orta parmağın distal falanksını tutar ve tırnağına hızla fiske vurur."], poz:"Başparmak ve işaret parmağında fleksiyon-addüksiyon.", y:"Boyun ağrılı hastada pozitifse servikal miyelopati açısından sevk (kırmızı bayrak); el beceriksizliği ve yürüme bozukluğu eşlik edebilir."},
 {id:"t_koordinasyon", ad:"Serebellar koordinasyon testleri", b:"noro", a:"Serebellar ataksi – dismetri, disdiadokokinezi, intansiyonel tremor", u:["Parmak-burun: kol uzatılıp işaret parmağı buruna, sonra terapistin parmağına götürülür (gözler açık/kapalı).","Topuk-diz-tibia: sırtüstü, topuk karşı dize konur ve tibia boyunca kaydırılır.","Hızlı alterne hareketler: ön kol pronasyon-supinasyonu (disdiadokokinezi).","Rebound testi."], poz:"Hedefi geçme/erişememe (dismetri), hedefe yaklaşınca artan tremor, yavaş ve düzensiz alterne hareketler.", y:"Gözler kapanınca belirgin kötüleşme duyusal ataksiyi, açıkken de bozukluk serebellar ataksiyi düşündürür. SARA ölçeği ile şiddet puanlanabilir."},
 {id:"t_pull", ad:"Çekme (pull / retropulsiyon) testi", b:"noro", a:"Parkinson'da postüral instabilite", u:["Hasta ayakta, gözler açık, ayaklar omuz genişliğinde; ne olacağı anlatılır.","Terapist arkada durarak omuzlardan hızlı ve kuvvetli bir geri çekme uygular (arkasında düşmeyi engelleyecek şekilde, duvar yakın)."], poz:"≥ 3 geri adım veya yakalanmazsa düşme.", y:"Hoehn & Yahr evre 3'ün belirleyicisidir; MDS-UPDRS madde 3.12."},
 {id:"t_beighton", ad:"Beighton hipermobilite skoru", b:"kardiyo", a:"Jeneralize eklem hipermobilitesi", u:["5 madde (4'ü bilateral, toplam 9 puan): 5. parmak MKF pasif ekstansiyonu > 90°, başparmağın ön kola değmesi, dirsek hiperekstansiyonu > 10°, diz hiperekstansiyonu > 10°, dizler düzken avuç içlerinin yere değmesi."], poz:"Yetişkinde ≥ 5/9 (50 yaş üstü ≥ 4, çocukta ≥ 6).", y:"Omuz multidireksiyonel instabilitesi, patellar instabilite ve hipermobilite spektrum bozukluğunda değerlendirilir."},

// ================= HAREKET ANALİZİ (animasyonlu çubuk figür) =================
const AL = {th:44, sh:43, tr:52, ua:29, fa:27};
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const dDown = a => [Math.sin(rad(a)), -Math.cos(rad(a))];           // aşağı dikeyden, + = öne
const dUp = a => [Math.sin(rad(a)), Math.cos(rad(a))];              // yukarı dikeyden, + = öne
const padd = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];
function footPts(ankle, phi){ // phi + = topuk yukarı
  const r = rad(phi), rot = ([x, y]) => [x * Math.cos(r) + y * Math.sin(r), -x * Math.sin(r) + y * Math.cos(r)];
  const h = rot([-6, -8]), t = rot([19, -8]);
  return {heel:padd(ankle, h), toe:padd(ankle, t)};
}
function lerpObj(a, b, u){
  if (typeof a === "number") return a + (b - a) * u;
  if (Array.isArray(a)) return a.map((x, i) => lerpObj(x, b[i], u));
  if (a && typeof a === "object"){ const o = {}; for (const k in a) o[k] = (b && k in b) ? lerpObj(a[k], b[k], u) : a[k]; return o; }
  return u < .5 ? a : b;
}

// ---------- SAGİTTAL ----------
function solveSag(P, cfg){
  const hip = [0, 0];
  const A = {t:P.A[0], k:P.A[1], f:P.A[2]}; A.s = A.t - A.k;
  A.knee = padd(hip, dDown(A.t), AL.th); A.ankle = padd(A.knee, dDown(A.s), AL.sh); Object.assign(A, footPts(A.ankle, A.f));
  let floorA = Math.min(A.heel[1], A.toe[1]);
  const box = P.box || cfg.box || 0;
  let floor = floorA - (cfg.anchor === "hip" ? 0 : box);
  const B = {};
  const Bs = P.B || P.A;
  if (Array.isArray(Bs)){ B.t = Bs[0]; B.k = Bs[1]; B.f = Bs[2]; B.s = B.t - B.k; B.knee = padd(hip, dDown(B.t), AL.th); B.ankle = padd(B.knee, dDown(B.s), AL.sh); }
  else { B.t = Bs.t; B.f = Bs.f; B.knee = padd(hip, dDown(B.t), AL.th);
    const fp = footPts([0, 0], B.f), low = Math.min(fp.heel[1], fp.toe[1]);
    const ay = floor - low; let c = (B.knee[1] - ay) / AL.sh; c = Math.max(-1, Math.min(1, c));
    B.s = (Bs.c || -1) * deg(Math.acos(c)); B.k = B.t - B.s; B.ankle = padd(B.knee, dDown(B.s), AL.sh); }
  Object.assign(B, footPts(B.ankle, B.f));
  if (cfg.anchor === "hip"){ floor = Math.min(A.heel[1], A.toe[1], B.heel[1], B.toe[1]); }
  let tr = P.tr || 0;
  if (cfg.omuz){ const dy = floor + 6; tr = -deg(Math.acos(Math.max(-1, Math.min(1, dy / AL.tr)))); }
  const td = dUp(tr), sh = padd(hip, td, AL.tr), head = cfg.omuz ? padd(sh, [-16, 5]) : padd(sh, td, 17);
  const arm = P.arm || [0, 10];
  const ua = cfg.omuz ? 90 : arm[0];
  const elbow = padd(sh, dDown(ua), AL.ua), hand = padd(elbow, dDown(ua + (cfg.omuz ? 0 : arm[1])), AL.fa);
  // ankraj
  let dx = 0;
  if (cfg.anchor === "hip") dx = 0;
  else if (cfg.anchor === "Atoe") dx = (cfg.x0 || 0) - A.toe[0];
  else dx = (cfg.x0 || 0) - A.ankle[0];
  const T = p => [p[0] + dx, p[1] - floor];
  const pts = {hip:T(hip), sh:T(sh), head:T(head), elbow:T(elbow), hand:T(hand),
    A:{knee:T(A.knee), ankle:T(A.ankle), heel:T(A.heel), toe:T(A.toe)}, B:{knee:T(B.knee), ankle:T(B.ankle), heel:T(B.heel), toe:T(B.toe)}};
  const m = {
    dizA:A.k, dizB:B.k, kalcaA:A.t + tr, kalcaB:B.t + tr, govdeUyluk:180 - (A.t + tr), govde:tr,
    bilekA:-A.s - A.f, bilekB:-B.s - B.f, kalcaY:pts.hip[1], box
  };
  return {pts, m, tr};
}
// ---------- FRONTAL ----------
function solveFront(P, cfg){
  const c = [0, 0], pr = rad(P.pel || 0);
  const hipL = [-10 * Math.cos(pr), 10 * Math.sin(pr)], hipR = [10 * Math.cos(pr), -10 * Math.sin(pr)];
  const leg = (hip, spec, sgn) => { const [a, b, ft, fk] = spec; const fs = ft - fk;
    const knee = padd(hip, [sgn * Math.sin(rad(a)), -Math.cos(rad(a))], AL.th * Math.cos(rad(ft)));
    const ankle = padd(knee, [sgn * Math.sin(rad(b)), -Math.cos(rad(b))], AL.sh * Math.cos(rad(fs)));
    return {hip, knee, ankle, a, b}; };
  const L = leg(hipL, P.L, -1), R = leg(hipR, P.R, 1);
  const floor = cfg.anchor === "L" ? L.ankle[1] - 8 : Math.min(L.ankle[1], R.ankle[1]) - 8;
  const lean = P.lean || 0; const td = [-Math.sin(rad(lean)), Math.cos(rad(lean))];
  const shc = padd(c, td, AL.tr), perp = [td[1], -td[0]];
  const shL = padd(shc, perp, -17), shR = padd(shc, perp, 17), head = padd(shc, td, 17);
  const handL = padd(shL, [-Math.sin(rad(8)), -Math.cos(rad(8))], 54), handR = padd(shR, [Math.sin(rad(8)), -Math.cos(rad(8))], 54);
  const dx = cfg.anchor === "L" ? (cfg.x0 || 0) - L.ankle[0] : (cfg.x0 || 0) - c[0];
  const T = p => [p[0] + dx, p[1] - floor];
  const pts = {c:T(c), hipL:T(hipL), hipR:T(hipR), L:{knee:T(L.knee), ankle:T(L.ankle)}, R:{knee:T(R.knee), ankle:T(R.ankle)}, shL:T(shL), shR:T(shR), shc:T(shc), head:T(head), handL:T(handL), handR:T(handR)};
  const m = {pelvis:P.pel || 0, lean, addL:(P.pel || 0) - P.L[0], valgL:P.L[1] - P.L[0], valgR:P.R[1] - P.R[0], kalcaY:pts.c[1]};
  return {pts, m};
}

function gaitPoses(tbl){ return tbl.map((row, i) => { const b = tbl[(i + 4) % 8]; const leg = r => { const s = r[0] - r[1]; return [r[0], r[1], r[2] - s]; };
  return {tr:3, A:leg(row), B:leg(b), arm:[-(row[0] - 10) * 0.6, 20]}; }); }

function anTimeline(a){ let T = 0; const seg = a.fazlar.map(f => { const s = {start:T, dur:f.dur, hold:f.hold}; T += f.dur + f.hold; return s; }); return {seg, total:T}; }
function anPose(a, v, t){
  const P = a.varyant[v].pozlar, {seg, total} = anTimeline(a); t = ((t % total) + total) % total;
  let i = seg.findIndex((s, j) => t >= s.start && (j === seg.length - 1 || t < seg[j + 1].start));
  const s = seg[i], local = t - s.start;
  let u = s.dur ? Math.min(1, local / s.dur) : 1; if (!a.cfg.lineer) u = u * u * (3 - 2 * u);
  const prev = P[(i - 1 + P.length) % P.length];
  return {pose:lerpObj(prev, P[i], u), faz:i, u};
}
function anSolve(a, pose){ return a.gorunum === "front" ? solveFront(pose, a.cfg) : solveSag(pose, a.cfg); }

function arcSVG(c, p1, p2, r, label, col, X){
  const a1 = Math.atan2(p1[1] - c[1], p1[0] - c[0]), a2 = Math.atan2(p2[1] - c[1], p2[0] - c[0]);
  let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const e1 = [c[0] + r * Math.cos(a1), c[1] + r * Math.sin(a1)], e2 = [c[0] + r * Math.cos(a1 + d), c[1] + r * Math.sin(a1 + d)];
  const mid = a1 + d / 2, lp = [c[0] + (r + 8) * Math.cos(mid), c[1] + (r + 8) * Math.sin(mid)];
  const [x1, y1] = X(e1), [x2, y2] = X(e2), [lx, ly] = X(lp);
  return `<path d="M${x1} ${y1} A${r} ${r} 0 0 ${d > 0 ? 0 : 1} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width=".7"/><text x="${lx}" y="${ly}" font-size="4.6" text-anchor="middle" dominant-baseline="middle" fill="#0d1017" font-weight="600">${label}</text>`;
}
function figSag(R, X, ghost, a){
  const p = R.pts, L = (q1, q2, w, c, o = 1) => { const [x1, y1] = X(q1), [x2, y2] = X(q2); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`; };
  const ink = ghost ? "#9aa1b0" : "#0d1017", far = ghost ? "#c9cfcd" : "#7a8191", w = ghost ? 1.1 : 1.8;
  let s = "";
  s += L(p.hip, p.B.knee, w, far) + L(p.B.knee, p.B.ankle, w, far) + L(p.B.heel, p.B.toe, w, far) + L(p.B.ankle, p.B.heel, w * .7, far);
  s += L(p.hip, p.sh, w + .3, ink) + L(p.sh, p.elbow, w * .8, ink) + L(p.elbow, p.hand, w * .8, ink);
  s += L(p.hip, p.A.knee, w, ink) + L(p.A.knee, p.A.ankle, w, ink) + L(p.A.heel, p.A.toe, w, ink) + L(p.A.ankle, p.A.heel, w * .7, ink);
  const [hx, hy] = X(p.head); s += `<circle cx="${hx}" cy="${hy}" r="${ghost ? 9 : 9}" fill="${ghost ? "none" : "#fff"}" stroke="${ink}" stroke-width="${w}"/>`;
  if (!ghost){
    [p.hip, p.A.knee].forEach(q => { const [x, y] = X(q); s += `<circle cx="${x}" cy="${y}" r="2.6" fill="#fff" stroke="#b3264a" stroke-width=".8"/><circle cx="${x}" cy="${y}" r=".9" fill="#b3264a"/>`; });
    [p.A.ankle, p.hand, p.A.toe].forEach(q => { const [x, y] = X(q); s += `<circle cx="${x}" cy="${y}" r="1.2" fill="#0d1017"/>`; });
  }
  return s;
}
function figFront(R, X, ghost){
  const p = R.pts, L = (q1, q2, w, c) => { const [x1, y1] = X(q1), [x2, y2] = X(q2); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; };
  const ink = ghost ? "#9aa1b0" : "#0d1017", w = ghost ? 1.1 : 1.8;
  let s = L(p.hipL, p.hipR, w, ink) + L(p.c, p.shc, w + .3, ink) + L(p.shL, p.shR, w, ink) + L(p.shL, p.handL, w * .8, ink) + L(p.shR, p.handR, w * .8, ink);
  ["L", "R"].forEach(k => { const hip = k === "L" ? p.hipL : p.hipR, g = p[k], sg = k === "L" ? -1 : 1; s += L(hip, g.knee, w, ink) + L(g.knee, g.ankle, w, ink) + L(g.ankle, [g.ankle[0], g.ankle[1] - 7], w, ink) + L([g.ankle[0] - 4, g.ankle[1] - 8], [g.ankle[0] + 4, g.ankle[1] - 8], w, ink); });
  const [hx, hy] = X(p.head); s += `<circle cx="${hx}" cy="${hy}" r="9" fill="${ghost ? "none" : "#fff"}" stroke="${ink}" stroke-width="${w}"/>`;

function aiHastaOzeti(p){
  const conds = (p.condIds || []).map(C).filter(Boolean);
  const L = [];

  if (p.oyku) L.push(`Öykü: ${p.oyku}`);
  if (p.uyari) L.push(`Uyarılar: ${p.uyari}`);
  const by = {}; (p.olcumler || []).forEach(o => (by[o.sid] = by[o.sid] || []).push(o));
  const ol = Object.entries(by).map(([sid, a]) => { a.sort((x, y) => x.tarih.localeCompare(y.tarih)); const sc = S(sid); if (!sc) return "";
    const f = a[0], l = a.at(-1), lab = o => scaleLabel(sc, o.deger) + (o.not ? ` (${o.not})` : "");
    return `- ${sc.ad}: ${a.length > 1 ? `ilk ${lab(f)} [${f.tarih}] → son ${lab(l)} [${l.tarih}]` : `${lab(l)} [${l.tarih}]`}`; }).filter(Boolean);
  if (ol.length) L.push("Ölçümler:\n" + ol.join("\n"));
  const g = p.program;
  if (g){
    const hed = (g.hedefler || []).map(h => `- (${h.vade === "uzun" ? "uzun" : "kısa"} dönem, ${h.durum || "devam"}) ${h.metin}`);
    if (hed.length) L.push("Hedefler:\n" + hed.join("\n"));
    const icf = Object.entries(g.icfProb || {}).filter(([, a]) => a.length).map(([k, a]) => `- ${ICF_SEVIYE[k]}: ${a.join("; ")}`);
    if (icf.length) L.push("ICF problem listesi:\n" + icf.join("\n"));
    if ((g.klinik || []).length) L.push("Klinik uygulamalar:\n" + g.klinik.map(k => `- ${k.ad}${k.sure ? " " + k.sure + " dk" : ""}${k.doz ? " – " + k.doz : ""}${k.not ? " (" + k.not + ")" : ""}`).join("\n"));

    L.push(`Sıklık/süre: ${g.sikl || "—"}, ${g.sure || "—"}`);

  if (ses.length) L.push("Son seanslar:\n" + ses.map(s => `- #${s.no} ${s.tarih}: ${(s.uygulanan || []).filter(u => u.yapildi).map(u => u.ad).join(", ") || "—"}${s.soap?.a ? " | Değerlendirme: " + s.soap.a : ""}${s.soap?.p ? " | Plan: " + s.soap.p : ""}`).join("\n"));

}

function aiMd(t){ // çok basit markdown → HTML
  const lines = esc(t || "").split("\n"); let out = "", inUl = false;
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>");
  for (const l of lines){
    const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m){ if (!inUl){ out += "<ul>"; inUl = true; } out += `<li>${inl(m[1])}</li>`; continue; }
    if (inUl){ out += "</ul>"; inUl = false; }
    const h = l.match(/^#{1,4}\s+(.*)/);
    if (h) out += `<h3>${inl(h[1])}</h3>`; else if (l.trim()) out += `<p style="margin:6px 0">${inl(l)}</p>`;
  }
  return out + (inUl ? "</ul>" : "");
}
